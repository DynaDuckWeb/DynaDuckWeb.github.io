<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DynaDuck Catalog</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #eeeeee;
    }


header { 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  background: #333; 
  padding: 15px 40px; 
  box-sizing: border-box;
  width: 100%;
}

.header-left { 
  display: flex; 
  align-items: center; 
  gap: 20px; 
}

.logo { 
  height: 70px; 
  cursor: pointer; 
  display: block;
}

nav { 
  display: flex; 
  gap: 25px; 
}

nav a { 
  text-decoration: none; 
  color: white; 
  font-weight: 600; 
  font-size: 1.05em; 
  transition: 0.2s; 
}

nav a:hover { 
  color: #11AD36; 
}

.search-container { 
  flex: 1; 
  display: flex; 
  justify-content: center; 
}

.search-bar { 
  width: 320px; 
  padding: 10px 12px; 
  border-radius: 8px; 
  border: none; 
  outline: none; 
  font-size: 1em; 
}

.green-btn {
  background: #11AD36;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 1em;
  transition: 0.2s;
  display: inline-block;
  text-decoration: none;
}

.green-btn:hover { 
  background: #0E8E2C; 
}

#authButtons {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-btn {
  background: #11AD36;
  color: white;
  border: none;
  padding: 8px 16px;
  min-width: 90px;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 0.95em;
  transition: background 0.15s ease;
  box-sizing: border-box;
}

.header-btn:hover {
  background: #0E8E2C;
}


.main-container {
  display: flex;
  justify-content: space-between;
  padding: 40px 50px;
  gap: 30px;
}

.left-column {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 320px;
  flex-shrink: 0;
}

.editor-top-row {
  display: flex;
  gap: 20px;
  align-items: flex-start;
}

.body-colors-panel {
  background: white;
  border-radius: 8px;
  padding: 15px;
  width: 140px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  box-sizing: border-box;
}

.body-colors-panel h3 {
  margin-top: 0;
  font-size: 16px;
  margin-bottom: 12px;
}

.body-colors-panel select {
  width: 100%;
  padding: 6px;
  margin-bottom: 15px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-weight: bold;
}

.color-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.color-box {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 6px;
  border: 2px solid rgba(0,0,0,0.2);
  cursor: pointer;
  transition: transform 0.1s;
}

.color-box:hover {
  transform: scale(1.1);
}

/* --- Avatar preview: classic old-school Roblox R6 style ---
   Flat matte colors, thin black outlines, sharp rectangular blocks
   for the torso/arms/legs, and a capsule-shaped head (not a circle). */
.avatar-container {
  position: relative;
  width: 150px;
  height: 260px;
  margin: 0 auto;
  background: transparent;
  box-sizing: border-box;
}

.av-part {
  position: absolute;
  box-sizing: border-box;
  border: 2px solid #000;
  transition: background-color 0.2s;
}

/* Classic Roblox head: capsule/cylinder shape, squished flatter */
.av-head {
  width: 62px;
  height: 58px;
  border-radius: 26px;
  top: 1px;
  left: 44px;
  z-index: 10;
}

/* Plain rectangular torso, no stripe or shading */
.av-torso {
  width: 74px;
  height: 84px;
  top: 54px;
  left: 38px;
  z-index: 5;
}

.av-l-arm {
  width: 34px;
  height: 84px;
  top: 54px;
  left: 4px;
}

.av-r-arm {
  width: 34px;
  height: 84px;
  top: 54px;
  left: 112px;
}

.av-l-leg {
  width: 37px;
  height: 76px;
  top: 138px;
  left: 38px;
}

.av-r-leg {
  width: 37px;
  height: 76px;
  top: 138px;
  left: 75px;
}

.inventory-panel {
  background: white;
  border-radius: 8px;
  padding: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  border: 2px solid #ccc;
}

.inventory-panel h3 {
  margin-top: 0;
  margin-bottom: 10px;
  font-size: 16px;
  text-align: center;
}

.inventory-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.inventory-item {
  border: 2px solid black;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: bold;
  text-align: center;
  background: #f9f9f9;
  cursor: pointer;
}

.inventory-item:hover {
  background: #e0e0e0;
}

.center-section {
  flex-grow: 1;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap; 
  gap: 25px;
}

.empty-msg {
  color: #888;
  font-size: 1.1em;
  margin-top: 40px;
}

.item-card {
  width: 160px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.item-box {
  border: 4px solid black;
  background: white;
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-sizing: border-box;
  padding: 10px;
}

.item-box h4 {
  margin: 0;
  font-size: 22px;
  line-height: 1.3;
}

.item-btn {
  border: none;
  background: #11AD36;
  border-radius: 10px;
  padding: 10px 5px;
  cursor: pointer;
  text-align: center;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  box-sizing: border-box;
  transition: background 0.15s;
}

.item-btn:hover {
  background: #0E8E2C;
}

.btn-text-buy {
  font-weight: bold;
  font-size: 16px;
  line-height: 1;
}

.btn-text-price {
  font-size: 12px;
  font-weight: bold;
  line-height: 1;
  opacity: 0.9;
}

.right-section {
  background: white;
  border-radius: 15px;
  padding: 25px 20px;
  width: 180px;
  height: fit-content;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.03);
  flex-shrink: 0;
}

.right-section h2 {
  margin-top: 0;
  font-size: 24px;
  margin-bottom: 25px;
}

.cat-button {
  display: block;
  width: 100%;
  background: white;
  border: 3px solid #cccccc;
  border-radius: 12px;
  padding: 8px 10px;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 12px;
  cursor: pointer;
  color: black;
  box-sizing: border-box;
  transition: 0.15s;
}

.cat-button:hover {
  border-color: #11AD36;
}

.cat-button.active {
  border-color: #11AD36;
  background: #eafaee;
  color: #0E8E2C;
}
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <img src="logo.png" class="logo" alt="DynaDuck" onclick="window.location.href='index.html'">
      <nav>
        <a href="catalog.html" class="active">Catalog</a>
        <a href="ideas.html">Ideas</a>
        <a href="create.html">Create</a>
        <a href="dynamites.html">Dynamites</a>
      </nav>
    </div>
    <div>
      <input type="text" class="search-bar" placeholder="Search...">
    </div>
    <div class="header-right" id="authButtons">
    </div>
  </header>

  <div class="main-container">

    <div class="left-column">

      <div class="editor-top-row">
        <div class="body-colors-panel">
          <h3>Body Colors</h3>
          <select id="bodyPartSelect">
            <option value="head">Head</option>
            <option value="torso">Torso</option>
            <option value="l-arm">Left Arm</option>
            <option value="r-arm">Right Arm</option>
            <option value="l-leg">Left Leg</option>
            <option value="r-leg">Right Leg</option>
          </select>

          <div class="color-grid">
            <div class="color-box" style="background: #ffcd3a;" onclick="applyColor('#ffcd3a')"></div>
            <div class="color-box" style="background: #0055ff;" onclick="applyColor('#0055ff')"></div>
            <div class="color-box" style="background: #11AD36;" onclick="applyColor('#11AD36')"></div>
            <div class="color-box" style="background: #e3242b;" onclick="applyColor('#e3242b')"></div>
            <div class="color-box" style="background: #ffffff;" onclick="applyColor('#ffffff')"></div>
            <div class="color-box" style="background: #222222;" onclick="applyColor('#222222')"></div>
          </div>
        </div>

        <div class="avatar-container">
          <div id="part-head" class="av-part av-head"></div>
          <div id="part-l-arm" class="av-part av-l-arm"></div>
          <div id="part-r-arm" class="av-part av-r-arm"></div>
          <div id="part-torso" class="av-part av-torso"></div>
          <div id="part-l-leg" class="av-part av-l-leg"></div>
          <div id="part-r-leg" class="av-part av-r-leg"></div>
        </div>
      </div>

      <div class="inventory-panel">
        <h3>My Wardrobe</h3>
        <div class="inventory-grid">
        </div>
      </div>

    </div>

    <div class="center-section">
    </div>

    <div class="right-section">
      <h2>Category</h2>
      <button class="cat-button" data-slot="torso" onclick="filterCategory('torso', this)">Shirts</button>
      <button class="cat-button" data-slot="legs" onclick="filterCategory('legs', this)">Pants</button>
      <button class="cat-button" data-slot="head" onclick="filterCategory('head', this)">Hats</button>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ",
      authDomain: "dynaduck-19dbb.firebaseapp.com",
      databaseURL: "https:dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dynaduck-19dbb",
      storageBucket: "dynaduck-19dbb.firebasestorage.app",
      messagingSenderId: "777148453502",
      appId: "1:777148453502:web:2f67ac439ec29dc4fc3e2f"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.database();
    const username = localStorage.getItem('loggedInUser');

    const defaultColors = {
        head: "#ffcd3a",
        torso: "#e3242b",
        "l-arm": "#ffcd3a",
        "r-arm": "#ffcd3a",
        "l-leg": "#ffcd3a",
        "r-leg": "#ffcd3a"
    };
    let catalogItems = {};
    let currentFilterSlot = null; 

    function updateHeader() {
        const authDiv = document.getElementById('authButtons');
        if (username) {
            authDiv.innerHTML = `
                <span style="color:white;font-weight:bold;">Welcome, ${username}!</span>
                <a href="settings.html"><button class="header-btn">Settings</button></a>
                <button class="header-btn" onclick="logout()">Logout</button>
            `;
        } else {
            authDiv.innerHTML = `
                <a href="signup.html"><button class="header-btn">Sign Up</button></a>
                <a href="login.html"><button class="header-btn">Log In</button></a>
            `;
        }
    }

    function logout() {
        localStorage.removeItem('loggedInUser');
        localStorage.removeItem('isAdmin');
        window.location.href = 'login.html';
    }

    async function initApp() {
        updateHeader();

        if (!username) return;

        const userRef = db.ref("users/" + username);

        const snapshot = await userRef.once("value");
        const user = snapshot.val() || {};

        const updates = {};
        if (user.Dynamites === undefined) updates.Dynamites = 1000;
        if (!user.inventory) updates.inventory = { "Starter Pack": true };
        if (!user.colors) updates.colors = defaultColors;
        if (!user.equipped) updates.equipped = {};

        if (Object.keys(updates).length > 0) {
            await userRef.update(updates);
        }

        const finalUser = (await userRef.once("value")).val() || {};

        loadColors(finalUser.colors || defaultColors);
        await loadCatalog();
        updateInventoryUI(finalUser.inventory || {}, finalUser.equipped || {});
    }
d elsewhere (e.g. an admin/create tool)
    async function loadCatalog() {
        const catalogRef = db.ref("catalog");
        const snapshot = await catalogRef.once("value");
        catalogItems = snapshot.val() || {};
        renderCatalog();
    }

    function renderCatalog() {
        const grid = document.querySelector(".center-section");
        grid.innerHTML = "";

        const entries = Object.entries(catalogItems).filter(([id, item]) => {
            if (!currentFilterSlot) return true;
            if (currentFilterSlot === "legs") return item.slot === "l-leg" || item.slot === "r-leg";
            return item.slot === currentFilterSlot;
        });

        if (entries.length === 0) {
            const msg = document.createElement("div");
            msg.className = "empty-msg";
            msg.textContent = currentFilterSlot
                ? "No items in this category yet."
                : "The catalog is empty right now.";
            grid.appendChild(msg);
            return;
        }

        entries.forEach(([id, item]) => {

            const card = document.createElement("div");
            card.className = "item-card";

            card.innerHTML = `
                <div class="item-box">
                    <h4>${item.name.replace(/ /g, "<br>")}</h4>
                </div>
                <button class="item-btn">
                    <span class="btn-text-buy">Buy</span>
                    <span class="btn-text-price">${Number(item.price || 0).toLocaleString()} Dynamites</span>
                </button>
            `;

            card.querySelector(".item-btn").onclick = () => buyItem(id, item);

            grid.appendChild(card);

        });
    }

    function filterCategory(slot, btnEl) {
        currentFilterSlot = (currentFilterSlot === slot) ? null : slot;

        document.querySelectorAll(".cat-button").forEach(b => b.classList.remove("active"));
        if (currentFilterSlot && btnEl) {
            btnEl.classList.add("active");
        }

        renderCatalog();
    }

    async function buyItem(itemId, item) {

        const userRef = db.ref("users/" + username);

        const snapshot = await userRef.once("value");

        const user = snapshot.val() || {
            Dynamites: 0,
            inventory: {},
            colors: defaultColors,
            equipped: {}
        };
      
        let currentDynamites = Number(user.Dynamites);
        if (!Number.isFinite(currentDynamites)) {
            console.warn("Dynamites was invalid (", user.Dynamites, "), resetting to 0");
            currentDynamites = 0;
            await userRef.update({ Dynamites: 0 });
        }

        if (user.inventory && user.inventory[item.name]) {
            alert("You already own this item.");
            return;
        }

        if (currentDynamites < item.price) {
            alert("Not enough Dynamites!");
            return;
        }

        await userRef.update({
            Dynamites: currentDynamites - item.price,
            ["inventory/" + item.name]: {
                slot: item.slot,
                color: item.color
            }
        });

        alert("Purchased " + item.name + "!");

        const updated = (await userRef.once("value")).val() || {};
        updateInventoryUI(updated.inventory || {}, updated.equipped || {});

    }

    function updateInventoryUI(inventory, equipped) {

        const container = document.querySelector(".inventory-grid");

        container.innerHTML = "";

        const itemNames = Object.keys(inventory).filter(name => name !== "Starter Pack");

        if (itemNames.length === 0) {
            const empty = document.createElement("div");
            empty.className = "inventory-item";
            empty.style.borderStyle = "dashed";
            empty.style.color = "#888";
            empty.textContent = "Empty";
            container.appendChild(empty);
            return;
        }

        itemNames.forEach(name => {

            const itemData = inventory[name];
            const slot = itemData && itemData.slot;
            const isEquipped = slot && equipped[slot] === name;

            const div = document.createElement("div");
            div.className = "inventory-item";
            div.textContent = name;

            if (isEquipped) {
                div.style.background = "#d4f8d4";
                div.style.borderColor = "#11AD36";
            }

            div.onclick = () => toggleEquip(name, itemData, equipped[slot] === name);

            container.appendChild(div);

        });

    }

    async function toggleEquip(itemName, itemData, currentlyEquipped) {

        if (!itemData || !itemData.slot) {
            return;
        }

        const userRef = db.ref("users/" + username);
        const slot = itemData.slot;

        if (currentlyEquipped) {
            await userRef.update({
                ["equipped/" + slot]: null,
                ["colors/" + slot]: defaultColors[slot]
            });
        } else {
            await userRef.update({
                ["equipped/" + slot]: itemName,
                ["colors/" + slot]: itemData.color
            });
        }

        const updated = (await userRef.once("value")).val() || {};
        loadColors(updated.colors || defaultColors);
        updateInventoryUI(updated.inventory || {}, updated.equipped || {});

    }

    function loadColors(colors) {
        Object.keys(colors).forEach(part => {
            const el = document.getElementById("part-" + part);
            if (el && colors[part]) {
                el.style.backgroundColor = colors[part];
            }
        });
    }

    async function applyColor(hexColor) {
        const part = document.getElementById("bodyPartSelect").value;
        const el = document.getElementById("part-" + part);
        if (el) {
            el.style.backgroundColor = hexColor;
        }

        const userRef = db.ref("users/" + username);
        await userRef.update({
            ["colors/" + part]: hexColor
        });
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>

</body>
</html>
