<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DynaDuck - Ideas</title>
<link rel="stylesheet" href="style.css">
<style>
body { font-family:'Poppins', sans-serif; margin:0; padding:0; background:#f2f2f2; color:#222; }
header { display:flex; align-items:center; justify-content:space-between; background:#333; padding:15px 40px; }
.header-left { display:flex; align-items:center; gap:20px; }
.logo { height:70px; cursor:pointer; }
nav { display:flex; gap:25px; }
nav a { text-decoration:none; color:white; font-weight:600; font-size:1.05em; transition:0.2s; }
nav a:hover { color:#11AD36; }
.search-container { flex:1; display:flex; justify-content:center; }
.search-bar { width:320px; padding:10px 12px; border-radius:8px; border:none; outline:none; font-size:1em; }
.green-btn {
  background:#11AD36;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  font-size:1em;
  transition:0.2s;
}
.green-btn:hover { background:#0E8E2C; }
.main-container { max-width:900px; margin:40px auto; padding:0 20px; }
.center-message { text-align:center; margin-top:100px; font-size:1.8em; font-weight:bold; color:#555; }
.idea-input {
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.1);
  margin-bottom:30px;
}
.idea-input textarea,
.idea-input input[type="text"] {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-bottom:10px;
  resize:none;
}
.idea {
  background:white;
  padding:15px 20px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,0.1);
}
.idea h3 { margin:0 0 5px 0; }
.idea .meta { font-size:0.85em; color:#11AD36; font-weight:600; margin-bottom:8px; }
.idea .actions {
  display:flex;
  gap:10px;
  margin-top:10px;
}
#adminReports {
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  margin-top:40px;
}
.report-card {
  border:1px solid #ccc;
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
  background:#fafafa;
}
.report-actions {
  display:flex;
  gap:10px;
  margin-top:5px;
}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <a href="index.html">
      <img src="logo.png" class="logo" alt="Logo">
    </a>
    <nav>
      <a href="catalog.html">Catalog</a>
      <a href="ideas.html">Ideas</a>
      <a href="create.html">Create</a>
      <a href="dynamites.html">Dynamites</a>
    </nav>
  </div>
  <div class="search-container">
    <input type="text" class="search-bar" placeholder="Search...">
  </div>
  <div id="authButtons"></div>
</header>

<div class="main-container">
  <div id="notLoggedIn" class="center-message">
    MAKE AN ACCOUNT TO ACCESS THIS PAGE :3
  </div>

  <div id="ideasContent" style="display:none;">
    <div class="idea-input">
      <input type="text" id="ideaTitle" placeholder="Idea title">
      <textarea id="ideaDesc" rows="3" placeholder="Idea description"></textarea>
      <button class="green-btn" onclick="addIdea()">Add Idea</button>
    </div>

    <div class="actions" style="margin-bottom:20px;">
      <button class="green-btn" onclick="sortIdeas('likes')">Sort by Likes</button>
      <button class="green-btn" onclick="sortIdeas('newest')">Sort by Newest</button>
    </div>

    <div id="ideasList"></div>

    <div id="adminReports" style="display:none;">
      <h2>Reported Ideas (Admin)</h2>
      <div id="reportsContainer"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ",
  authDomain: "dynaduck-19dbb.firebaseapp.com",
  databaseURL: "https://dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dynaduck-19dbb",
  storageBucket: "dynaduck-19dbb.firebasestorage.app",
  messagingSenderId: "777148453502",
  appId: "1:777148453502:web:2f67ac439ec29dc4fc3e2f"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();
function getUid() {
  try { if (window.firebaseAuth && firebaseAuth.currentUser) return firebaseAuth.currentUser.uid; } catch (e) {}
  return localStorage.getItem('firebaseUid');
}

function getUser() {
  return localStorage.getItem("loggedInUser");
}
function escHtml(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

const urlRegex = /(https?:\/\/|www\.|[a-zA-Z0-9-]+\.(com|net|org|io|gg|co|xyz|ru|cn|uk|us|ca|de|fr|ro|br|it|nl|pl|gov|edu|info|me|tv|app|dev|link|site|store|online))/i;

const bannedWords = [
  "fuck", "fucking", "fucked", "fucker", "shit", "shitting", "shitty", "bitch", "bitching",
  "asshole", "bastard", "dick", "dickhead", "pussy", "cunt", "cock", "cocksucker",
  "whore", "slut", "idiot", "dumbass", "moron", "imbecile", "trash", "dipshit", "jackass",
  "nigga", "nigger", "fag", "faggot", "retard", "retarded", "chink", "spic", "kike", "kyke",
  "tranny", "dyke", "gay", "lesbian", "bi", "bisexual",
  "pula", "pulă", "pizda", "pizdă", "pizdiet", "pula-n", "muie", "futu-ti", "futu-ți", "futut",
  "mue", "cacat", "căcat", "sugi", "sugme", "futu", "curwa", "curva", "labagiu", "handicapat",
  "putain", "merde", "connard", "connasse", "salope", "encule", "enculé", "chienne", "pd",
  "pedé", "pede", "pétasse", "petasse", "bite", "couille", "nique", "niquer",
  "puta", "puto", "pendejo", "pendeja", "cabron", "cabrona", "maricon", "maricón", "verga",
  "mierda", "joto", "chinga", "chingar", "chingado", "culero", "mamón", "mamon",
  "scheisse", "scheiße", "arschloch", "fotze", "wixer", "wichser", "ficken", "hurensohn",
  "blyat", "cyka", "сука", "блять", "пидор", "хуй", "пизда", "долбоеб", "ебать", "гандон",
  "stronzo", "vaffanculo", "cazzo", "merda", "stronza", "figa", "troia", "puttana",
  "caralho", "porra", "viado", "arrombado", "filho da puta", "buceta", "cacete",
  "kurwa", "jebac", "jebać", "chuj", "pierdol", "suka", "pizda", "cipa",
  "kanker", "kut", "tyfus", "lul", "klootzak", "hoer",
  "amk", "amq", "sik", "sikerim", "orospu", "piç", "pic", "yarrak", "göt",
  "discord", "dsc.gg", "invite", "youtube", "youtu.be", "tiktok", "instagram",
  "twitch", "twitter", "x.com", "facebook", "reddit", "telegram", "whatsapp",
  "snapchat", "roblox", "onlyfans", "kick.com", "steamcommunity", "gui", "script", "hack"
];

function isBlocked(text = "") {
  if (!text) return false;
  const lower = text.toLowerCase();
  if (urlRegex.test(lower)) return true;
  return bannedWords.some(w => {
    const escaped = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`\\b${escaped}\\b`, 'i');
    return regex.test(lower) || lower.includes(w);
  });
}

function updateHeader() {
  const user = getUser();
  const authDiv = document.getElementById("authButtons");
  if (!user) {
    authDiv.innerHTML = `
      <a href="signup.html"><button class="header-btn">Sign Up</button></a>
      <a href="login.html"><button class="header-btn">Log In</button></a>
    `;
    document.getElementById("notLoggedIn").style.display = "block";
    document.getElementById("ideasContent").style.display = "none";
    return;
  }

  authDiv.textContent = '';
  var span = document.createElement('span');
  span.style.cssText = 'color:white;font-weight:bold;';
  span.textContent = user;
  var setA = document.createElement('a'); setA.href = 'settings.html';
  var setB = document.createElement('button'); setB.className = 'header-btn'; setB.textContent = 'Settings';
  setA.appendChild(setB);
  var out = document.createElement('button'); out.className = 'header-btn'; out.textContent = 'Logout';
  out.onclick = logout;
  authDiv.appendChild(span); authDiv.appendChild(setA); authDiv.appendChild(out);
  document.getElementById("notLoggedIn").style.display = "none";
  document.getElementById("ideasContent").style.display = "block";
  loadPosts();
  // Admin reports require the `admin` custom claim; server rules enforce read.
  if (localStorage.getItem('isAdmin') === 'true') loadReports();
}

function logout() {
  try { localStorage.removeItem("loggedInUser"); localStorage.removeItem("firebaseUid"); localStorage.removeItem("firebaseEmail"); localStorage.removeItem("isAdmin"); } catch (e) {}
  try { if (window.firebaseAuth) { firebaseAuth.signOut().finally(function(){ location.reload(); }); return; } } catch (e) {}
  location.reload();
}

window.addEventListener("DOMContentLoaded", updateHeader);

function addIdea() {
  const user = getUser();
  const uid = getUid();
  if (!user || !uid) return alert("Login required");
  const title = document.getElementById("ideaTitle").value.trim().slice(0, 80);
  const text = document.getElementById("ideaDesc").value.trim().slice(0, 1000);
  if (!title || !text) return alert("Fill all fields");
  if (isBlocked(title + " " + text)) return alert("Blocked content detected");
  db.ref("posts").push().set({
    title: title,
    text: text,
    user: user,
    creator: user,
    creatorUid: uid,
    timestamp: Date.now()
  }).catch(function (e) { alert('Could not post: ' + (e.message || e)); });
  document.getElementById("ideaTitle").value = "";
  document.getElementById("ideaDesc").value = "";
}

let postsListenerAttached = false;

function loadPosts() {
  if (postsListenerAttached) return;
  postsListenerAttached = true;
  const container = document.getElementById("ideasList");
  db.ref("posts").limitToLast(100).on("value", snap => {
    container.innerHTML = "";
    snap.forEach(postSnap => {
      const post = postSnap.val() || {};
      const id = postSnap.key;
      if (/[.#$[\]]/.test(id)) return;
      const div = document.createElement("div");
      div.className = "idea";
      var h = document.createElement('h3'); h.textContent = post.title || 'Untitled';
      var meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = 'By ' + (post.user || post.creator || 'Anonymous');
      var p = document.createElement('p'); p.textContent = post.text || '';
      var acts = document.createElement('div'); acts.className = 'actions';
      var rb = document.createElement('button'); rb.className = 'green-btn'; rb.textContent = 'Reply';
      rb.onclick = (function (pid) { return function () { toggleReply(pid); }; })(id);
      var rp = document.createElement('button'); rp.className = 'green-btn'; rp.textContent = 'Report';
      rp.onclick = (function (pid) { return function () { reportPost(pid); }; })(id);
      acts.appendChild(rb); acts.appendChild(rp);
      var replies = document.createElement('div'); replies.id = 'replies-' + id;
      var box = document.createElement('div'); box.id = 'replyBox-' + id; box.style.display = 'none'; box.style.marginTop = '10px';
      var inp = document.createElement('input'); inp.id = 'replyInput-' + id; inp.style.cssText = 'width:100%;padding:8px;box-sizing:border-box;';
      var send = document.createElement('button'); send.className = 'green-btn'; send.textContent = 'Send';
      send.onclick = (function (pid) { return function () { addReply(pid); }; })(id);
      box.appendChild(inp); box.appendChild(send);
      div.appendChild(h); div.appendChild(meta); div.appendChild(p); div.appendChild(acts); div.appendChild(replies); div.appendChild(box);
      container.appendChild(div);
      loadReplies(id);
    });
  });
}

function toggleReply(id) {
  const box = document.getElementById("replyBox-" + id);
  if (box) box.style.display = box.style.display === "none" ? "block" : "none";
}

function addReply(postId) {
  const user = getUser();
  const uid = getUid();
  if (!user || !uid) return alert("Login required");
  if (/[.#$[\]]/.test(postId)) return;
  const input = document.getElementById("replyInput-" + postId);
  if (!input) return;
  const text = input.value.trim().slice(0, 500);
  if (!text) return;
  if (isBlocked(text)) return alert("Blocked content");
  db.ref("replies/" + postId).push().set({
    user: user,
    creator: user,
    creatorUid: uid,
    text: text,
    timestamp: Date.now()
  }).catch(function (e) { alert('Could not reply: ' + (e.message || e)); });
  input.value = "";
}

function loadReplies(postId) {
  const container = document.getElementById("replies-" + postId);
  if (!container) return;
  db.ref("replies/" + postId).off();
  db.ref("replies/" + postId).limitToLast(50).on("value", snap => {
    container.innerHTML = "";
    snap.forEach(r => {
      const reply = r.val() || {};
      const div = document.createElement("div");
      div.style.borderTop = "1px solid #ddd";
      div.style.padding = "5px";
      div.textContent = (reply.user || reply.creator || 'User') + ': ' + (reply.text || '');
      container.appendChild(div);
    });
  });
}

function reportPost(postId) {
  const user = getUser();
  const uid = getUid();
  if (!user || !uid) return alert("Login required");
  if (/[.#$[\]]/.test(postId)) return;
  const reason = prompt("Why report? (max 200 chars)");
  if (!reason) return;
  db.ref("reports").push().set({
    postId: postId,
    reporter: user,
    reporterUid: uid,
    reason: String(reason).slice(0, 200),
    timestamp: Date.now()
  }).then(function () { alert("Reported!"); })
    .catch(function (e) { alert('Report failed: ' + (e.message || e)); });
}

function loadReports() {
  if (localStorage.getItem('isAdmin') !== 'true') return;
  document.getElementById("adminReports").style.display = "block";
  const container = document.getElementById("reportsContainer");
  db.ref("reports").limitToLast(100).on("value", snap => {
    container.innerHTML = "";
    snap.forEach(repSnap => {
      const rep = repSnap.val() || {};
      const repId = repSnap.key;
      if (!rep.postId || /[.#$[\]]/.test(rep.postId) || /[.#$[\]]/.test(repId)) return;
      db.ref("posts/" + rep.postId).once("value").then(postSnap => {
        if (!postSnap.exists()) return;
        const post = postSnap.val() || {};
        const div = document.createElement("div");
        div.className = "report-card";
        var p1 = document.createElement('p'); p1.textContent = 'Reporter: ' + (rep.reporter || '');
        var p2 = document.createElement('p'); p2.textContent = 'Reason: ' + (rep.reason || '');
        var p3 = document.createElement('p'); p3.textContent = 'Post: ' + (post.title || '');
        var acts = document.createElement('div'); acts.className = 'report-actions';
        var del = document.createElement('button'); del.className = 'green-btn'; del.textContent = 'Delete';
        del.onclick = (function (pid, rid) { return function () { deletePost(pid, rid); }; })(rep.postId, repId);
        var dis = document.createElement('button'); dis.className = 'green-btn'; dis.style.background = '#ccc'; dis.textContent = 'Dismiss';
        dis.onclick = (function (rid) { return function () { dismissReport(rid); }; })(repId);
        acts.appendChild(del); acts.appendChild(dis);
        div.appendChild(p1); div.appendChild(p2); div.appendChild(p3); div.appendChild(acts);
        container.appendChild(div);
      });
    });
  }, function () {
    container.textContent = 'Cannot load reports (admin claim required).';
  });
}

function deletePost(postId, reportId) {
  if (localStorage.getItem('isAdmin') !== 'true') { alert('Admin only.'); return; }
  if (/[.#$[\]]/.test(postId) || /[.#$[\]]/.test(reportId)) return;
  if (!confirm('Delete this post and its replies?')) return;
  db.ref("posts/" + postId).remove().catch(function (e) { alert('Delete failed (admin claim required): ' + e.message); });
  db.ref("replies/" + postId).remove();
  db.ref("reports/" + reportId).remove();
}

function dismissReport(reportId) {
  if (localStorage.getItem('isAdmin') !== 'true') { alert('Admin only.'); return; }
  if (/[.#$[\]]/.test(reportId)) return;
  db.ref("reports/" + reportId).remove().catch(function (e) { alert('Dismiss failed: ' + e.message); });
}
</script>

</body>
