<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create T-Shirt - DynaDuck</title><link rel="stylesheet" href="style.css"><style>.ugc-page{max-width:700px;margin:40px auto;padding:0 20px}.ugc-panel{background:#fff;border-radius:12px;padding:25px;box-shadow:0 4px 20px #0001}.ugc-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}.ugc-field label{font-weight:bold}.ugc-field input,.ugc-field textarea{box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit}.notice{background:#fff8df;border:1px solid #e5c85c;border-radius:8px;padding:12px;color:#5c4a00;margin-bottom:20px}.scan-status{font-size:12px;font-weight:bold;margin-top:6px;color:#555}.price-row{display:flex;gap:10px;align-items:center}.price-row input{max-width:140px}</style></head>
<body><header><div class="header-left"><a href="index.html"><img src="logo.png" class="logo" alt="DynaDuck"></a><nav><a href="catalog.html">Catalog</a><a href="ideas.html">Ideas</a><a href="create.html">Create</a><a href="dynamites.html">Dynamites</a></nav></div><div class="search-container"><input class="search-bar" type="search" placeholder="Search places, creators..."></div><div id="authButtons"></div></header>
<main class="ugc-page"><section class="ugc-panel"><h1>Create T-Shirt</h1><div class="notice">Upload a finished PNG showing the design for the front of the torso. Every submission is reviewed before it appears in the catalog.</div><div class="ugc-field"><label for="ugcName">T-shirt name</label><input id="ugcName" maxlength="40" placeholder="Blue T-shirt"></div><div class="ugc-field"><label for="ugcDescription">Description</label><textarea id="ugcDescription" maxlength="300" rows="3" placeholder="Describe the T-shirt"></textarea></div><div class="ugc-field"><label for="ugcPrice">Price in Dynamites (0–100)</label><div class="price-row"><input id="ugcPrice" type="number" min="0" max="100" step="1" value="0"><span>/ 100 maximum</span></div></div><div class="ugc-field"><label for="ugcImage">Finished T-shirt PNG</label><input id="ugcImage" type="file" accept="image/png"><div id="ugcStatus" class="scan-status"></div></div><button id="submitUgc" class="green-btn" type="button">Submit for Review</button></section></main>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script><script src="search.js"></script><script>
var c={apiKey:'AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ',authDomain:'dynaduck-19dbb.firebaseapp.com',databaseURL:'https://dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app',projectId:'dynaduck-19dbb',storageBucket:'dynaduck-19dbb.firebasestorage.app',messagingSenderId:'777148453502',appId:'1:777148453502:web:2f67ac439ec29dc4fc3e2f'};if(!firebase.apps.length)firebase.initializeApp(c);var db=firebase.database(),user=localStorage.getItem('loggedInUser');function esc(v){var d=document.createElement('div');d.textContent=String(v||'');return d.innerHTML;}function header(){var e=document.getElementById('authButtons');if(!user){e.innerHTML='<a href="signup.html"><button class="header-btn">Sign Up</button></a><a href="login.html"><button class="header-btn">Log In</button></a>';return;}e.innerHTML='<span style="color:white;font-weight:bold">Welcome, '+esc(user)+'!</span><a href="settings.html"><button class="header-btn">Settings</button></a><button class="header-btn" onclick="localStorage.removeItem(\'loggedInUser\');localStorage.removeItem(\'isAdmin\');location.href=\'login.html\';">Logout</button>';}
function read(f){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){resolve(r.result)};r.onerror=reject;r.readAsDataURL(f);});}document.getElementById('submitUgc').onclick=async function(){if(!user){alert('Please log in first.');return;}var name=document.getElementById('ugcName').value.trim(),desc=document.getElementById('ugcDescription').value.trim(),price=Number(document.getElementById('ugcPrice').value),file=document.getElementById('ugcImage').files[0],s=document.getElementById('ugcStatus');if(!name||!desc||!file){alert('Complete every field and choose a PNG.');return;}if(!Number.isInteger(price)||price<0||price>100){alert('Price must be a whole number from 0 to 100.');return;}if(file.type!=='image/png'||file.size>2*1024*1024){alert('Choose a PNG smaller than 2 MB.');return;}s.textContent='Submitting for review...';try{await db.ref('ugcSubmissions').push({name:name,description:desc,slot:'torso',type:'tshirt',price:price,creator:user,image:await read(file),status:'pending',createdAt:Date.now()});s.textContent='Submitted for review.';alert('Your T-shirt was submitted for review.');}catch(e){s.textContent='Submission failed.';alert('Could not submit T-shirt: '+e.message);}};window.addEventListener('DOMContentLoaded',header);
</script></body></html>
