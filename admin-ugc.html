<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create UGC</title>
</head>
<body>
  <h1>Submit T-Shirt</h1>

  <input id="name" placeholder="T-shirt name" /><br><br>
  <textarea id="desc" placeholder="Description"></textarea><br><br>
  <input id="price" type="number" min="0" max="100" value="0" /><br><br>
  <input id="file" type="file" accept="image/png" /><br><br>

  <button id="submitBtn">Submit for Review</button>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ",
      authDomain: "dynaduck-19dbb.firebaseapp.com",
      databaseURL: "https://dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dynaduck-19dbb",
      storageBucket: "dynaduck-19dbb.firebasestorage.app",
      messagingSenderId: "777148453502",
      appId: "1:777148453502:web:2f67ac439ec29dc4fc3e2f"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("submitBtn").addEventListener("click", async function () {
      const user = auth.currentUser;
      if (!user) {
        alert("Please log in first.");
        return;
      }

      const name = document.getElementById("name").value.trim();
      const desc = document.getElementById("desc").value.trim();
      const price = Number(document.getElementById("price").value);
      const file = document.getElementById("file").files[0];

      if (!name || !desc || !file) {
        alert("Fill in all fields and pick a PNG.");
        return;
      }

      if (!Number.isInteger(price) || price < 0 || price > 100) {
        alert("Price must be a whole number from 0 to 100.");
        return;
      }

      if (file.type !== "image/png") {
        alert("Only PNG files are allowed.");
        return;
      }

      try {
        const imageData = await readFileAsDataURL(file);

        await db.ref("ugcSubmissions").push({
          name: name,
          description: desc,
          slot: "torso",
          type: "tshirt",
          price: price,
          creator: user.email || "Unknown user",
          creatorUid: user.uid,
          image: imageData,
          status: "pending",
          createdAt: Date.now()
        });

        alert("Submitted for review!");
        document.getElementById("name").value = "";
        document.getElementById("desc").value = "";
        document.getElementById("price").value = "0";
        document.getElementById("file").value = "";
      } catch (err) {
        console.error(err);
        alert("Submission failed: " + err.message);
      }
    });
  </script>
</body>
</html>
