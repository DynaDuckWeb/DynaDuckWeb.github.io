<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DynaDuck - Admin Requests Panel</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #eeeeee;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #333;
      padding: 15px 40px;
      box-sizing: border-box;
      width: 100%;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      height: 70px;
      cursor: pointer;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: 600;
      font-size: 1.05em;
    }

    #authButtons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-btn {
      background: #11AD36;
      color: white;
      border: none;
      padding: 8px 16px;
      min-width: 90px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95em;
      transition: background 0.15s ease;
      box-sizing: border-box;
      text-decoration: none;
    }

    .header-btn:hover {
      background: #0E8E2C;
    }

    .admin-container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
      color: #333;
    }

    .access-denied {
      color: #d9534f;
      text-align: center;
      font-size: 1.2em;
      padding: 40px 0;
    }

    .request-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    .request-card {
      border: 2px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafafa;
    }

    .request-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-preview-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      vertical-align: middle;
      margin-left: 8px;
    }

    .item-preview-box {
      width: 50px;
      height: 50px;
      border: 2px solid black;
      display: inline-block;
      vertical-align: middle;
      border-radius: 4px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn-approve {
      background: #11AD36;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-approve:hover {
      background: #0E8E2C;
    }

    .btn-reject {
      background: #e3242b;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-reject:hover {
      background: #b81b21;
    }

    .empty-msg {
      color: #777;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <img src="logo.png" class="logo" alt="DynaDuck" onclick="window.location.href='index.html'">
      <nav>
        <a href="catalog.html">Catalog</a>
        <a href="ideas.html">Ideas</a>
        <a href="create.html">Create</a>
        <a href="admin-requests.html" style="color: #11AD36;">Admin Panel</a>
      </nav>
    </div>
    <div id="authButtons"></div>
  </header>

  <div class="admin-container" id="adminContent">
    <h1>Pending UGC Catalog Requests</h1>
    <div id="requestsList" class="request-list">
      <p>Loading requests...</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ",
      authDomain: "dynaduck-19dbb.firebaseapp.com",
      databaseURL: "https://dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dynaduck-19dbb",
      storageBucket: "dynaduck-19dbb.firebasestorage.app",
      messagingSenderId: "777148453502",
      appId: "1:777148453502:web:2f67ac439ec29dc4fc3e2f"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.database();
    const auth = firebase.auth();
    function escHtml(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }
    function currentUsername() { return localStorage.getItem('loggedInUser') || ''; }

    function updateHeader() {
      const authDiv = document.getElementById('authButtons');
      const username = currentUsername();
      if (username) {
        authDiv.textContent = '';
        var span = document.createElement('span');
        span.style.cssText = 'color:white;font-weight:bold;';
        span.textContent = 'Welcome, ' + username + '!';
        var a = document.createElement('a'); a.href = 'settings.html'; a.className = 'header-btn'; a.textContent = 'Settings';
        var b = document.createElement('button'); b.className = 'header-btn'; b.textContent = 'Logout'; b.onclick = logout;
        authDiv.appendChild(span); authDiv.appendChild(a); authDiv.appendChild(b);
      } else {
        authDiv.innerHTML =
          '<a href="signup.html" class="header-btn">Sign Up</a>' +
          '<a href="login.html" class="header-btn">Log In</a>';
      }
    }

    function logout() {
      try { localStorage.removeItem('loggedInUser'); localStorage.removeItem('firebaseUid'); localStorage.removeItem('firebaseEmail'); localStorage.removeItem('isAdmin'); } catch (e) {}
      auth.signOut().finally(function () { window.location.href = 'login.html'; });
    }

    async function checkAdminAndLoad() {
      updateHeader();

      var user = auth.currentUser;
      var username = currentUsername();
      if (!user || !username) {
        // Wait briefly for auth restore before denying.
        setTimeout(async function () {
          user = auth.currentUser;
          if (!user) { showAccessDenied("Please log in first."); return; }
          await verifyAdmin(user);
        }, 800);
        // Optimistic: try token claim immediately if available.
        if (!user) return;
      }
      await verifyAdmin(user || auth.currentUser);
    }

    async function verifyAdmin(user) {
      if (!user) { showAccessDenied("Please log in first."); return; }
      try {
        var token = await user.getIdTokenResult(true);
        if (token.claims && token.claims.admin === true) {
          try { localStorage.setItem('isAdmin', 'true'); } catch (e) {}
          loadUgcRequests();
          return;
        }
      } catch (e) {}
      // Fallback for legacy setup: local flag (server rules still enforce admin writes).
      if (localStorage.getItem('isAdmin') === 'true') { loadUgcRequests(); return; }
      showAccessDenied("Access Denied: Admin custom claim required. (Server rules enforce this — client checks alone are not enough.)");
    }

    function showAccessDenied(msg) {
      const container = document.getElementById('adminContent');
      container.textContent = '';
      var div = document.createElement('div'); div.className = 'access-denied';
      var h = document.createElement('h2'); h.textContent = msg;
      div.appendChild(h); container.appendChild(div);
    }

    async function loadUgcRequests() {
      let snapshot;
      try {
        snapshot = await db.ref("ugcSubmissions").once("value");
      } catch (e) {
        showAccessDenied("Cannot load submissions (permission denied). Admin claim required.");
        return;
      }
      const requests = snapshot.val() || {};

      const listContainer = document.getElementById("requestsList");
      listContainer.innerHTML = "";

      const keys = Object.keys(requests);

      if (keys.length === 0) {
        listContainer.innerHTML = `<p class="empty-msg">No pending requests at the moment.</p>`;
        return;
      }

      keys.forEach(requestId => {
        if (/[.#$[\]]/.test(requestId)) return;
        const item = requests[requestId] || {};
        
        const card = document.createElement("div");
        card.className = "request-card";

        const info = document.createElement("div");
        info.className = "request-info";
        function row(label, value) {
          var div = document.createElement('div');
          var s = document.createElement('strong'); s.textContent = label + ': ';
          div.appendChild(s); div.appendChild(document.createTextNode(String(value == null ? 'N/A' : value)));
          return div;
        }
        var nameRow = document.createElement('div');
        var ns = document.createElement('strong'); ns.textContent = 'Item Name: ';
        nameRow.appendChild(ns); nameRow.appendChild(document.createTextNode(String(item.name || 'Unnamed')));
        if (typeof item.image === 'string' && /^(data:image\/|https:\/\/)/.test(item.image.trim())) {
          var im = document.createElement('img'); im.src = item.image.trim(); im.className = 'item-preview-img'; im.alt = String(item.name || '');
          nameRow.appendChild(im);
        } else if (item.color) {
          var bx = document.createElement('span'); bx.className = 'item-preview-box';
          if (/^#[0-9a-fA-F]{6}$/.test(String(item.color))) bx.style.backgroundColor = item.color;
          nameRow.appendChild(bx);
        }
        info.appendChild(nameRow);
        info.appendChild(row('Description', item.description || 'N/A'));
        info.appendChild(row('Type / Slot', (item.type || 'tshirt') + ' (' + (item.slot || 'torso') + ')'));
        info.appendChild(row('Price', Number(item.price || 0) + ' Dynamites'));
        info.appendChild(row('Creator', (item.creator || 'Unknown') + (item.creatorUid ? ' (' + String(item.creatorUid).slice(0, 8) + '…)' : '')));
        info.appendChild(row('Status', item.status || 'pending'));

        var actions = document.createElement('div'); actions.className = 'actions';
        var ok = document.createElement('button'); ok.className = 'btn-approve'; ok.textContent = 'Accept';
        ok.onclick = function () { approveRequest(requestId); };
        var no = document.createElement('button'); no.className = 'btn-reject'; no.textContent = 'Reject';
        no.onclick = function () { rejectRequest(requestId); };
        actions.appendChild(ok); actions.appendChild(no);
        card.appendChild(info); card.appendChild(actions);

        listContainer.appendChild(card);
      });
    }

    async function approveRequest(requestId) {
      if (/[.#$[\]]/.test(requestId)) return;
      const requestRef = db.ref("ugcSubmissions/" + requestId);
      const snap = await requestRef.once("value");
      const item = snap.val();

      if (!item) return;
      var price = Math.max(0, Math.min(100, Number(item.price || 0)));
      if (!item.name || String(item.name).length > 40) { alert('Invalid item name.'); return; }

      const newCatalogRef = db.ref("catalog").push();
      try {
        await newCatalogRef.set({
          name: String(item.name).slice(0, 40),
          description: String(item.description || "").slice(0, 300),
          type: "tshirt",
          slot: "torso",
          price: price,
          color: null,
          image: (typeof item.image === 'string' ? item.image.slice(0, 300000) : null),
          creator: String(item.creator || "Community").slice(0, 40),
          creatorUid: item.creatorUid || null,
          status: "approved",
          createdAt: item.createdAt || Date.now()
        });
      } catch (e) { alert('Approve failed (admin claim required): ' + e.message); return; }

      await requestRef.remove();

      alert('Approved "' + item.name + '"! It is now live in the catalog.');
      loadUgcRequests();
    }

    async function rejectRequest(requestId) {
      if (/[.#$[\]]/.test(requestId)) return;
      if (!confirm("Reject and delete this request?")) return;

      try {
        await db.ref("ugcSubmissions/" + requestId).remove();
      } catch (e) { alert('Reject failed (admin claim required): ' + e.message); return; }
      alert("Request removed.");
      loadUgcRequests();
    }

    window.addEventListener('DOMContentLoaded', checkAdminAndLoad);
  </script>
</body>
</html>
