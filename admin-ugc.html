<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGC Review - DynaDuck</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #efefef; }
    .admin-wrap { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .admin-panel { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    .admin-panel h1 { margin-top: 0; }
    .ugc-list { display: grid; gap: 18px; }
    .ugc-card { border: 1px solid #d7d7d7; border-radius: 12px; padding: 16px; background: #fafafa; }
    .ugc-row { display: grid; grid-template-columns: 220px 1fr; gap: 18px; }
    .ugc-image { width: 100%; max-height: 240px; object-fit: contain; background: white; border: 1px solid #ccc; border-radius: 8px; }
    .ugc-meta { margin-top: 4px; color: #555; font-size: 0.9em; }
    .ugc-actions { display: flex; gap: 12px; margin-top: 16px; }
    .approve-btn { background: #11AD36; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .reject-btn { background: #d33; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    @media (max-width: 700px) { .ugc-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <a href="index.html"><img src="logo.png" class="logo" alt="Logo"></a>
    <nav>
      <a href="catalog.html">Catalog</a>
      <a href="ideas.html">Ideas</a>
      <a href="create.html">Create</a>
      <a href="dynamites.html">Dynamites</a>
    </nav>
  </div>
  <div class="search-container"><input type="text" class="search-bar" placeholder="Search..."></div>
  <div id="authButtons"></div>
</header>

<main class="admin-wrap">
  <section class="admin-panel">
    <h1>UGC Review Queue</h1>
    <div id="ugcList"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="search.js"></script>
<script>
var firebaseConfig = {
  apiKey: 'AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ',
  authDomain: 'dynaduck-19dbb.firebaseapp.com',
  databaseURL: 'https://dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'dynaduck-19dbb',
  storageBucket: 'dynaduck-19dbb.firebasestorage.app',
  messagingSenderId: '777148453502',
  appId: '1:777148453502:web:2f67ac439ec29dc4fc3e2f'
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var currentUser = localStorage.getItem('loggedInUser');
var isAdmin = currentUser === 'Admin' && localStorage.getItem('isAdmin') === 'true';

function updateHeader(){
  var auth = document.getElementById('authButtons');
  if (!auth) return;
  if (!currentUser) {
    auth.innerHTML = '<a href="signup.html"><button class="header-btn">Sign Up</button></a><a href="login.html"><button class="header-btn">Log In</button></a>';
    return;
  }
  auth.innerHTML = '<span style="color:white;font-weight:bold;">Welcome, ' + (currentUser || 'Admin') + '!</span>' +
    '<a href="settings.html"><button class="header-btn">Settings</button></a>' +
    '<button class="header-btn" onclick="localStorage.removeItem(\'loggedInUser\');localStorage.removeItem(\'isAdmin\');window.location.href=\'login.html\';">Logout</button>';
}

if (!isAdmin) {
  alert('Admin access only.');
  window.location.href = 'index.html';
}

function renderQueue() {
  var list = document.getElementById('ugcList');
  db.ref('ugcSubmissions').orderByChild('createdAt').once('value').then(function (snapshot) {
    var items = [];
    snapshot.forEach(function (child) {
      var item = child.val() || {};
      if (item.status === 'pending' || item.status === 'needs_review' || item.status === 'ai_approved_preview') {
        items.push({ id: child.key, ...item });
      }
    });
    items.reverse();
    if (!items.length) {
      list.innerHTML = '<p>No UGC pending review.</p>';
      return;
    }
    list.innerHTML = items.map(function (item) {
      return '<div class="ugc-card">' +
        '<div class="ugc-row">' +
        '<img class="ugc-image" src="' + (item.image || '') + '" alt="UGC preview">' +
        '<div>' +
        '<h3>' + (item.name || 'Untitled T-shirt') + '</h3>' +
        '<div class="ugc-meta">By ' + (item.creator || 'Unknown') + ' · ' + (item.slot || 'torso') + ' · ' + new Date(item.createdAt || Date.now()).toLocaleString() + '</div>' +
        '<p>' + (item.description || 'No description.') + '</p>' +
        '<div class="ugc-actions">' +
        '<button class="approve-btn" data-id="' + item.id + '">Approve</button>' +
        '<button class="reject-btn" data-id="' + item.id + '">Reject</button>' +
        '</div>' +
        '</div>' +
        '</div>' +
        '</div>';
    }).join('');

    document.querySelectorAll('.approve-btn').forEach(function (button) {
      button.addEventListener('click', function () {
        approveSubmission(button.getAttribute('data-id'));
      });
    });
    document.querySelectorAll('.reject-btn').forEach(function (button) {
      button.addEventListener('click', function () {
        rejectSubmission(button.getAttribute('data-id'));
      });
    });
  });
}

function approveSubmission(id) {
  var ref = db.ref('ugcSubmissions/' + id);
  ref.once('value').then(function (snap) {
    var item = snap.val() || {};
    return db.ref('catalog/' + id).set({
      name: item.name,
      description: item.description,
      creator: item.creator,
      slot: 'torso',
      type: item.type || 'tshirt',
      price: item.price || 150,
      color: item.color || '#ffffff',
      image: item.image || '',
      approvedBy: currentUser,
      approvedAt: Date.now(),
      status: 'approved'
    }).then(function () {
      return ref.update({
        status: 'approved',
        reviewedBy: currentUser,
        reviewedAt: Date.now()
      });
    });
  }).then(function () {
    renderQueue();
    alert('UGC approved and added to the catalog.');
  }).catch(function (error) {
    console.error(error);
    alert('Approval failed: ' + (error.message || error));
  });
}

function rejectSubmission(id) {
  db.ref('ugcSubmissions/' + id).update({
    status: 'rejected',
    reviewedBy: currentUser,
    reviewedAt: Date.now()
  }).then(function () {
    renderQueue();
    alert('UGC rejected.');
  }).catch(function (error) {
    console.error(error);
    alert('Rejection failed: ' + (error.message || error));
  });
}

window.addEventListener('DOMContentLoaded', function () {
  updateHeader();
  renderQueue();
});
</script>
</body>
</html>
