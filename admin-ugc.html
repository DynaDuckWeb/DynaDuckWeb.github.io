<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGC Review - DynaDuck</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #efefef; }
    .admin-wrap { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .admin-panel { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    .ugc-list { display: grid; gap: 18px; }
    .ugc-card { border: 1px solid #d7d7d7; border-radius: 12px; padding: 16px; background: #fafafa; }
    .ugc-row { display: grid; grid-template-columns: 220px 1fr; gap: 18px; }
    .ugc-image { width: 100%; max-height: 240px; object-fit: contain; background: white; border: 1px solid #ccc; border-radius: 8px; }
    .ugc-meta { margin-top: 4px; color: #555; font-size: .9em; }
    .ugc-actions { display: flex; gap: 12px; margin-top: 16px; }
    .approve-btn, .reject-btn { color: white; border: 0; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .approve-btn { background: #11AD36; }
    .reject-btn { background: #d33; }
    @media (max-width: 700px) { .ugc-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header><div class="header-left"><a href="index.html"><img src="logo.png" class="logo" alt="Logo"></a><nav><a href="catalog.html">Catalog</a><a href="ideas.html">Ideas</a><a href="create.html">Create</a><a href="dynamites.html">Dynamites</a></nav></div><div class="search-container"><input type="text" class="search-bar" placeholder="Search..."></div><div id="authButtons"></div></header>
<main class="admin-wrap"><section class="admin-panel"><h1>UGC Review Queue</h1><div id="ugcList"></div></section></main>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script><script src="search.js"></script>
<script>
var config={apiKey:'AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ',authDomain:'dynaduck-19dbb.firebaseapp.com',databaseURL:'https://dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app',projectId:'dynaduck-19dbb',storageBucket:'dynaduck-19dbb.firebasestorage.app',messagingSenderId:'777148453502',appId:'1:777148453502:web:2f67ac439ec29dc4fc3e2f'};
if(!firebase.apps.length)firebase.initializeApp(config);var db=firebase.database(),currentUser=localStorage.getItem('loggedInUser');
function esc(v){var d=document.createElement('div');d.textContent=String(v==null?'':v);return d.innerHTML;}
function adminCheck(){if(currentUser!=='Admin'){location.replace('index.html');return false;}return true;}
function updateHeader(){var a=document.getElementById('authButtons');if(!a)return;a.innerHTML='<span style="color:white;font-weight:bold;">Welcome, Admin!</span><a class="header-btn" href="catalog.html">Catalog</a><button class="header-btn" id="adminLogout">Logout</button>';document.getElementById('adminLogout').onclick=function(){localStorage.removeItem('loggedInUser');localStorage.removeItem('isAdmin');location.href='login.html';};}
function renderQueue(){var list=document.getElementById('ugcList');db.ref('ugcSubmissions').orderByChild('createdAt').once('value').then(function(s){var rows=[];s.forEach(function(c){var x=c.val()||{};if(x.status==='pending'||x.status==='needs_review'||x.status==='ai_approved_preview')rows.push({id:c.key,data:x});});rows.reverse();if(!rows.length){list.innerHTML='<p>No UGC pending review.</p>';return;}list.innerHTML=rows.map(function(row){var x=row.data;return '<article class="ugc-card"><div class="ugc-row"><img class="ugc-image" src="'+esc(x.image||'')+'" alt="UGC preview"><div><h3>'+esc(x.name||'Untitled T-shirt')+'</h3><div class="ugc-meta">By '+esc(x.creator||'Unknown')+' · '+esc(x.type||'tshirt')+' · '+new Date(x.createdAt||Date.now()).toLocaleString()+'</div><p>'+esc(x.description||'No description.')+'</p><div class="ugc-actions"><button class="approve-btn" data-id="'+esc(row.id)+'">Approve</button><button class="reject-btn" data-id="'+esc(row.id)+'">Reject</button></div></div></div></article>';}).join('');document.querySelectorAll('.approve-btn').forEach(function(b){b.onclick=function(){approve(b.dataset.id);};});document.querySelectorAll('.reject-btn').forEach(function(b){b.onclick=function(){reject(b.dataset.id);};});});}
function approve(id){var ref=db.ref('ugcSubmissions/'+id);ref.once('value').then(function(s){var x=s.val()||{};return db.ref('catalog/'+id).set({name:x.name||'T-shirt',description:x.description||'',creator:x.creator||'',slot:'torso',type:'tshirt',price:Number(x.price||150),image:x.image||'',status:'approved',approvedBy:'Admin',approvedAt:Date.now()}).then(function(){return ref.update({status:'approved',reviewedBy:'Admin',reviewedAt:Date.now()});});}).then(function(){renderQueue();}).catch(function(e){alert('Approval failed: '+e.message);});}
function reject(id){db.ref('ugcSubmissions/'+id).update({status:'rejected',reviewedBy:'Admin',reviewedAt:Date.now()}).then(renderQueue).catch(function(e){alert('Rejection failed: '+e.message);});}
if(adminCheck())window.addEventListener('DOMContentLoaded',function(){updateHeader();renderQueue();});
</script>
</body>
</html>
