<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create - DynaDuck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
    }

    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 24px;
    }

    h1 {
      font-size: 2.2em;
      font-weight: 800;
      border-bottom: 3px solid #11AD36;
      padding-bottom: 12px;
      color: #0f172a;
      margin-top: 0;
      letter-spacing: -0.02em;
    }

    .download-section {
      background: #f0fdf4;
      border: 2px dashed #86efac;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
    }

    .download-info h3 {
      margin: 0 0 6px 0;
      color: #15803d;
      font-size: 1.2em;
      font-weight: 700;
    }

    .download-info p {
      margin: 0;
      font-size: 0.95em;
      color: #475569;
      line-height: 1.4;
    }

    .studio-btn {
      background: #11AD36;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95em;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(17, 173, 54, 0.25);
    }

    .studio-btn:hover {
      background: #0e912d;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(17, 173, 54, 0.35);
    }

    .publish-box {
      background: white;
      padding: 36px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .publish-box h2 {
      margin-top: 0;
      font-size: 1.4em;
      font-weight: 700;
      margin-bottom: 24px;
      color: #0f172a;
    }

    .form-group {
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-weight: 700;
      color: #334155;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.98em;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #f8fafc;
    }

    .form-control:focus {
      outline: none;
      border-color: #11AD36;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(17, 173, 54, 0.15);
    }

    .roblox-publish-btn {
      background: #00b06f; 
      color: white;
      border: none;
      border-bottom: 5px solid #008252; 
      border-radius: 10px;
      width: 100%;
      padding: 16px 0;
      font-size: 1.05em;
      font-family: inherit;
      font-weight: 800;
      letter-spacing: 0.03em;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.15s ease;
    }

    .roblox-publish-btn:hover {
      background: #00c47c;
      transform: translateY(-1px);
    }

    .roblox-publish-btn:active {
      border-bottom-width: 1px;
      transform: translateY(4px);
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="index.html">
      <img src="logo.png" class="logo" alt="Logo" />
    </a>
    <nav>
      <a href="catalog.html">Catalog</a>
      <a href="ideas.html">Ideas</a>
      <a href="create.html">Create</a>
      <a href="dynamites.html">Dynamites</a>
    </nav>
  </div>

  <div class="search-container">
    <input type="text" class="search-bar" placeholder="Search places, creators...">
  </div>

  <div id="authButtons">
    <a href="signup.html"><button class="green-btn">Sign Up</button></a>
    <a href="login.html"><button class="green-btn">Log In</button></a>
  </div>
</header>

<main>
  <h1>Create & Publish</h1>
  
  <div class="download-section">
    <div class="download-info">
      <h3>DynaDuck Engine Editor</h3>
      <p>Build worlds inside our custom offline software tool, then export them.</p>
    </div>
    <a href="DynaDuckSetup.exe" download class="studio-btn">⬇ Download Studio</a>
  </div>

  <div class="publish-box">
    <h2>Deploy New Map Card</h2>
    
    <div class="form-group">
      <label for="gameTitle">Game Name</label>
      <input type="text" id="gameTitle" class="form-control" placeholder="My cool game location...">
    </div>

    <div class="form-group">
      <label for="gameDesc">Description</label>
      <textarea id="gameDesc" class="form-control" rows="4" placeholder="Tell users what your place is about..."></textarea>
    </div>

    <div class="form-group">
      <label for="maxPlayers">Max Server Size (Limit: 20)</label>
      <input type="number" id="maxPlayers" class="form-control" min="1" max="20" value="12">
    </div>

    <div class="form-group">
      <label for="duckFile">Upload .duck File</label>
      <input type="file" id="duckFile" accept=".duck" class="form-control" style="padding: 10px;">
    </div>

    <button class="roblox-publish-btn" onclick="submitGame()">PUBLISH PLACE</button>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ",
  authDomain: "dynaduck-19dbb.firebaseapp.com",
  databaseURL: "https://dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dynaduck-19dbb",
  storageBucket: "dynaduck-19dbb.firebasestorage.app",
  messagingSenderId: "777148453502",
  appId: "1:777148453502:web:2f67ac439ec29dc4fc3e2f"
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
var db = firebase.database();
const loggedInUser = localStorage.getItem('loggedInUser');

const BANNED_WORDS = [
  "fuck", "shit", "ass", "bitch", "bastard", "cunt", "dick", "idiot", "stupid", "discord", "telegram", "whatapp", "twitter", "@", "youtube",
  "pula", "pizda", "coie", "cur", "drac", "cacat", "muta", "prost", "proasta", "tampit", "muie", "belit",
  "merde", "con", "connard", "putain", "salope", "chier", "cul", "bâtard"
];

function containsSwears(text) {
  if (!text) return false;
  const cleanText = text.toLowerCase().replace(/[\.\-\_\,\?\!\@\#\$\%\^\&\*\(\)]/g, "");
  const words = cleanText.split(/\s+/);

  for (let word of words) {
    if (BANNED_WORDS.includes(word)) {
      return true;
    }
  }
  
  for (let badWord of BANNED_WORDS) {
    if (cleanText.includes(badWord)) {
      return true;
    }
  }
  return false;
}

function updateHeader() {
  const authDiv = document.getElementById('authButtons');
  if(loggedInUser){
    authDiv.innerHTML = `
      <span style="color:#333;font-weight:bold;margin-right:15px;">Welcome, ${loggedInUser}!</span>
      <a href="settings.html"><button class="green-btn">Settings</button></a>
      <button class="green-btn" onclick="logout()">Logout</button>
    `;
  } else {
    authDiv.innerHTML = `
      <a href="signup.html"><button class="green-btn">Sign Up</button></a>
      <a href="login.html"><button class="green-btn">Log In</button></a>
    `;
  }
}

function logout(){
  localStorage.removeItem('loggedInUser');
  location.reload();
}

function submitGame() {
  if (!loggedInUser) {
    alert("You must be logged in to create and publish game instances!");
    return;
  }

  var title = document.getElementById('gameTitle').value.trim();
  var desc = document.getElementById('gameDesc').value.trim();
  var maxPlayers = parseInt(document.getElementById('maxPlayers').value, 10);
  var fileInput = document.getElementById('duckFile');

  if (!title || !desc || fileInput.files.length === 0) {
    alert("Please fill in all options and upload a .duck file map metadata frame.");
    return;
  }

  if (isNaN(maxPlayers) || maxPlayers < 1 || maxPlayers > 20) {
    alert("Maximum player capacity boundary constraint error. Must be an integer between 1 and 20.");
    return;
  }
  if (containsSwears(title) || containsSwears(desc)) {
    alert("⚠️ Text input flag exception: Your Title or Description contains inappropriate language/insults blocked by our multi-language filters.");
    return;
  }

  var file = fileInput.files[0];

  var fileName = file.name.toLowerCase();
  if (!fileName.endsWith('.duck')) {
    alert("❌ Security Block: Invalid file format detected! You can only upload official engine export structures (.duck). Files like .mp4, .exe, or .html are strictly blocked.");
    fileInput.value = "";
    return;
  }

  if (file.size > 2 * 1024 * 1024) { 
    alert("❌ File size limit exceeded! Your map data must be smaller than 2MB.");
    fileInput.value = "";
    return;
  }

  var reader = new FileReader();

  reader.onload = function(e) {
    var fileContents = e.target.result;

    var newGameRef = db.ref('games').push();
    newGameRef.set({
      title: title,
      description: desc,
      creator: loggedInUser,
      maxPlayers: maxPlayers,
      fileData: fileContents,
      timestamp: Date.now()
    }, function(error) {
      if (error) {
        alert("Database cluster rejected upload payload configuration frame data.");
      } else {
        alert("Game node successfully compiled onto homepage directory!");
        window.location.href = "index.html";
      }
    });
  };

  reader.readAsText(file);
}

window.addEventListener('DOMContentLoaded', updateHeader);
</script>
</body>
</html>
