<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DynaDuck Search</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .search-page { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .search-page h1 { margin: 0 0 30px; }
    .results-section { margin-bottom: 35px; }
    .results-section h2 { margin: 0 0 15px; padding-bottom: 8px; border-bottom: 2px solid #11AD36; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
    .result-card { display: flex; flex-direction: column; background: white; border-radius: 12px; padding: 18px; box-shadow: 0 3px 12px rgba(0,0,0,0.1); }
    .result-card h3 { margin: 0 0 8px; }
    .result-card p { color: #666; font-size: .9em; line-height: 1.4; margin: 5px 0; }
    .result-card button { align-self: flex-start; margin-top: 12px; background: #11AD36; color: white; border: none; border-radius: 8px; padding: 10px 18px; font-weight: bold; cursor: pointer; }
    .result-card button:hover { background: #0E8E2C; }
    .result-card button:disabled { background: #999; cursor: default; }
    .result-card .login-friend { text-decoration: none; display: inline-block; margin-top: 12px; background: #11AD36; color: white; border-radius: 8px; padding: 10px 18px; font-weight: bold; }
    .empty-results { color: #666; background: white; border-radius: 12px; padding: 18px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
    @media (max-width: 700px) { header { flex-wrap: wrap; gap: 12px; padding: 12px 18px; } .search-container { order: 3; flex-basis: 100%; } .search-bar { width: 100%; } }
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <a href="index.html"><img src="logo.png" class="logo" alt="Logo"></a>
    <nav><a href="catalog.html">Catalog</a><a href="ideas.html">Ideas</a><a href="create.html">Create</a><a href="dynamites.html">Dynamites</a></nav>
  </div>
  <div class="search-container"><input id="searchInput" class="search-bar" type="search" placeholder="Search places, creators..." aria-label="Search games and people"></div>
  <div id="authButtons"><a href="signup.html"><button class="header-btn">Sign Up</button></a><a href="login.html"><button class="header-btn">Log In</button></a></div>
</header>
<main class="search-page">
  <h1 id="searchHeading">Search games and people</h1>
  <section class="results-section"><h2>Games</h2><div id="gameResults" class="results-grid"><p>Loading games...</p></div></section>
  <section class="results-section"><h2>People</h2><div id="peopleResults" class="results-grid"><p>Loading people...</p></div></section>
</main>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="firebase-auth.js"></script>
<script>
var config={apiKey:'AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ',authDomain:'dynaduck-19dbb.firebaseapp.com',databaseURL:'https://dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app',projectId:'dynaduck-19dbb',storageBucket:'dynaduck-19dbb.firebasestorage.app',messagingSenderId:'777148453502',appId:'1:777148453502:web:2f67ac439ec29dc4fc3e2f'};
if(!firebase.apps.length) firebase.initializeApp(config);
var db=firebase.database();
function curUid(){try{if(window.firebaseAuth&&firebaseAuth.currentUser)return firebaseAuth.currentUser.uid;}catch(e){}return localStorage.getItem('firebaseUid');}
function curName(){return localStorage.getItem('loggedInUser');}
var currentUser=curName(), currentUidVal=curUid(), relationship={friends:{},outgoingRequests:{},incomingRequests:{}};
function esc(value){var d=document.createElement('div');d.textContent=String(value||'');return d.innerHTML;}
function query(){try{return new URLSearchParams(location.search).get('q')||'';}catch(e){return '';}}
function matches(value,q){if(!q)return true;return String(value||'').toLocaleLowerCase().includes(String(q||'').toLocaleLowerCase());}
function updateHeader(){var auth=document.getElementById('authButtons');var un=curName();if(!un)return;auth.textContent='';var s=document.createElement('span');s.style.cssText='color:white;font-weight:bold;';s.textContent='Welcome, '+un+'!';var a=document.createElement('a');a.href='settings.html';var sb=document.createElement('button');sb.className='header-btn';sb.textContent='Settings';a.appendChild(sb);var lo=document.createElement('button');lo.className='header-btn';lo.textContent='Logout';lo.onclick=logout;auth.appendChild(s);auth.appendChild(a);auth.appendChild(lo);}
function logout(){try{localStorage.removeItem('loggedInUser');localStorage.removeItem('firebaseUid');localStorage.removeItem('firebaseEmail');localStorage.removeItem('isAdmin');}catch(e){}try{if(window.firebaseAuth){firebaseAuth.signOut().finally(function(){location.reload();});return;}}catch(e){}location.reload();}
function has(name,group){return relationship[group] && relationship[group][name];}
async function sendRequest(name,button){var uid=curUid(),uname=curName();if(!uid||!uname){alert('Please log in first.');return;}if(name===uname){return;}if(/[.#$[\]/]/.test(name)){alert('Invalid username.');return;}button.disabled=true;var ts=Date.now();try{var map=await db.ref('usernames/'+name).once('value');if(!map.exists())throw Error('That user does not exist.');var targetUid=map.val();if(has(name,'friends')){button.textContent='Friends';return;}if(has(name,'outgoingRequests')){button.textContent='Requested';return;}await db.ref('users/'+uid+'/outgoingRequests/'+name).set(ts);try{await db.ref('users/'+targetUid+'/friendRequests/'+uname).set(ts);}catch(e){await db.ref('users/'+uid+'/outgoingRequests/'+name).remove();throw e;}relationship.outgoingRequests[name]=ts;button.textContent='Requested';}catch(e){button.disabled=false;alert(e.message||'Friend request failed.');}}
function renderGames(data,q){var el=document.getElementById('gameResults');el.innerHTML='';var entries=Object.entries(data||{}).slice(0,200);var found=entries.filter(function(e){var g=e[1]||{};return !q||matches(g.title,q)||matches(g.description,q)||matches(g.creator,q);}).slice(0,50);if(!found.length){el.innerHTML='<p class="empty-results">No games matched your search.</p>';return;}found.forEach(function(e){var g=e[1]||{},card=document.createElement('article');card.className='result-card';var h=document.createElement('h3');h.textContent=g.title||'Untitled game';var by=document.createElement('p');by.textContent='By '+(g.creator||'Anonymous');var ds=document.createElement('p');ds.textContent=g.description||'';card.appendChild(h);card.appendChild(by);card.appendChild(ds);el.appendChild(card);});}
function renderPeople(names,q){var el=document.getElementById('peopleResults');el.innerHTML='';var uname=curName();var found=(names||[]).filter(function(n){return !q||matches(n,q);}).slice(0,50);if(!found.length){el.innerHTML='<p class="empty-results">No people matched your search.</p>';return;}found.forEach(function(name){var card=document.createElement('article');card.className='result-card';var h=document.createElement('h3');h.textContent=name;var p=document.createElement('p');p.textContent='@'+name;card.appendChild(h);card.appendChild(p);if(name!==uname){if(!uname){var a=document.createElement('a');a.className='login-friend';a.href='login.html';a.textContent='Log in to add friend';card.appendChild(a);}else{var b=document.createElement('button');b.textContent=has(name,'friends')?'Friends':has(name,'outgoingRequests')?'Requested':'Add Friend';b.disabled=has(name,'friends')||has(name,'outgoingRequests');(function(n,btn){btn.onclick=function(){sendRequest(n,btn);};})(name,b);card.appendChild(b);}}el.appendChild(card);});}
function load(){var q=query().trim().slice(0,80);document.getElementById('searchInput').value=q;document.getElementById('searchHeading').textContent=q?('Results for \u201C'+q+'\u201D'):'Search games and people';updateHeader();var uid=curUid();var relP=uid?db.ref('users/'+uid).once('value').catch(function(){return {val:function(){return {};}};}):Promise.resolve({val:function(){return {};}});relP.then(function(s){var u=(s.val&&s.val())||{};relationship={friends:u.friends||{},outgoingRequests:u.outgoingRequests||{},incomingRequests:u.friendRequests||{}};return Promise.all([db.ref('games').limitToLast(200).once('value').catch(function(){return {val:function(){return {};}};}),db.ref('usernames').once('value').catch(function(){return {val:function(){return {};}};})]);}).then(function(s){var games=(s[0].val&&s[0].val())||{};var unames=s[1].val&&s[1].val()||{};renderGames(games,q);renderPeople(Object.keys(unames||{}).filter(function(k){return/^[A-Za-z0-9_]{3,15}$/.test(k);}).sort(),q);}).catch(function(){document.getElementById('gameResults').innerHTML='<p class="empty-results">Could not load search results.</p>';});}
window.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
