<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DynaDuck Search</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .search-page { max-width: 1000px; margin: 35px auto; padding: 0 20px; }
    .search-page h1 { margin-bottom: 25px; }
    .results-section { margin: 28px 0; }
    .results-section h2 { border-bottom: 2px solid #11AD36; padding-bottom: 8px; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
    .result-card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 9px rgba(0,0,0,.1); }
    .result-card h3 { margin: 0 0 8px; }
    .result-card p { color: #666; font-size: .9em; min-height: 20px; }
    .result-card button { background: #11AD36; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; font-weight: bold; cursor: pointer; }
    .result-card button:disabled { background: #999; cursor: default; }
    .empty-results { color: #666; }
    @media (max-width: 700px) { header { flex-wrap: wrap; gap: 12px; padding: 12px 18px; } .search-container { order: 3; flex-basis: 100%; } .search-bar { width: 100%; } }
  </style>
</head>
<body>
<header>
  <div class="header-left"><a href="index.html"><img src="logo.png" class="logo" alt="DynaDuck"></a><nav><a href="catalog.html">Catalog</a><a href="ideas.html">Ideas</a><a href="create.html">Create</a><a href="dynamites.html">Dynamites</a></nav></div>
  <div class="search-container"><input id="searchInput" class="search-bar" type="search" placeholder="Search games and people..."></div>
  <div id="authButtons"></div>
</header>
<main class="search-page">
  <h1 id="searchHeading">Search results</h1>
  <section class="results-section"><h2>Games</h2><div id="gameResults" class="results-grid"><p>Loading games...</p></div></section>
  <section class="results-section"><h2>People</h2><div id="peopleResults" class="results-grid"><p>Loading people...</p></div></section>
</main>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="search.js"></script>
<script>
var config={apiKey:'AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ',authDomain:'dynaduck-19dbb.firebaseapp.com',databaseURL:'https://dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app',projectId:'dynaduck-19dbb',storageBucket:'dynaduck-19dbb.firebasestorage.app',messagingSenderId:'777148453502',appId:'1:777148453502:web:2f67ac439ec29dc4fc3e2f'};
if(!firebase.apps.length) firebase.initializeApp(config); var db=firebase.database();
var currentUser=localStorage.getItem('loggedInUser');
function esc(value){var d=document.createElement('div');d.textContent=String(value||'');return d.innerHTML;}
function query(){return new URLSearchParams(location.search).get('q')||'';}
function matches(value,q){return String(value||'').toLocaleLowerCase().includes(q.toLocaleLowerCase());}
function renderGames(data,q){var el=document.getElementById('gameResults');el.innerHTML='';var found=Object.entries(data||{}).filter(function(e){var g=e[1]||{};return matches(g.title,q)||matches(g.description,q)||matches(g.creator,q);});if(!found.length){el.innerHTML='<p class="empty-results">No games matched your search.</p>';return;}found.forEach(function(e){var g=e[1]||{},card=document.createElement('article');card.className='result-card';card.innerHTML='<h3>'+esc(g.title||'Untitled game')+'</h3><p>By '+esc(g.creator||'Anonymous')+'</p><p>'+esc(g.description||'')+'</p>';el.appendChild(card);});}
function sendRequest(name,button){if(!currentUser){alert('Log in to add friends.');return;}if(name===currentUser){alert('You cannot add yourself.');return;}button.disabled=true;db.ref('users/'+name).once('value').then(function(s){if(!s.exists())throw Error('That user does not exist.');return db.ref('users/'+currentUser+'/outgoingRequests/'+name).set(Date.now()).then(function(){return db.ref('users/'+name+'/friendRequests/'+currentUser).set(Date.now());});}).then(function(){button.textContent='Requested';}).catch(function(e){button.disabled=false;alert(e.message||'Friend request failed.');});}
function renderPeople(data,q){var el=document.getElementById('peopleResults');el.innerHTML='';var found=Object.entries(data||{}).filter(function(e){var u=e[1]||{};return matches(e[0],q)||matches(u.username,q)||matches(u.displayName,q);});if(!found.length){el.innerHTML='<p class="empty-results">No people matched your search.</p>';return;}found.forEach(function(e){var name=e[0],u=e[1]||{},card=document.createElement('article');card.className='result-card';card.innerHTML='<h3>'+esc(u.displayName||name)+'</h3><p>@'+esc(name)+'</p>';if(currentUser&&name!==currentUser){var b=document.createElement('button');b.textContent='Add Friend';b.onclick=function(){sendRequest(name,b);};card.appendChild(b);}el.appendChild(card);});}
function load(){var q=query().trim();document.getElementById('searchInput').value=q;document.getElementById('searchHeading').textContent=q?'Results for “'+q+'”':'Search games and people';Promise.all([db.ref('games').once('value'),db.ref('users').once('value')]).then(function(s){renderGames(s[0].val(),q);renderPeople(s[1].val(),q);}).catch(function(){document.getElementById('gameResults').innerHTML='<p class="empty-results">Could not load search results.</p>';});}
window.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
