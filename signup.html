<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - DynaDuck</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container { display:flex; justify-content:center; align-items:center; min-height:80vh; }
    .auth-box { background:white; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); width:100%; max-width:400px; text-align:center; }
    .auth-box h1 { margin-top:0; margin-bottom:20px; font-size:2em; color:#333; }
    .auth-box input { width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; margin-bottom:15px; box-sizing:border-box; font-size:1em; outline:none; }
    .auth-box input:focus { border-color:#11AD36; }
    .auth-box button { width:100%; padding:12px; font-size:1.05em; }
    .auth-box p { margin-top:20px; font-size:0.9em; color:#666; }
    .auth-box p a { color:#11AD36; text-decoration:none; font-weight:600; }
    .auth-box p a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="index.html"><img src="logo.png" class="logo" alt="Logo"></a>
      <nav>
        <a href="catalog.html">Catalog</a>
        <a href="ideas.html">Ideas</a>
        <a href="create.html">Create</a>
        <a href="dynamites.html">Dynamites</a>
      </nav>
    </div>
    <div class="search-container"><input type="text" class="search-bar" placeholder="Search..."></div>
    <div id="authButtons"></div>
  </header>

  <div class="auth-container">
    <div class="auth-box">
      <h1>Create Account</h1>
      <form id="signupForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="green-btn">Sign Up</button>
      </form>
      <p>Already have an account? <a href="login.html">Log In</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="firebase-auth.js"></script>

  <script>
    function getAuth() { return window.firebaseAuth || firebase.auth(); }
    function getDb() { return window.firebaseDb || firebase.database(); }

    function normalizeForModeration(input) {
      var s = String(input || '');
      s = s.replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g, '');
      s = s.normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
      s = s.toLowerCase();
      s = s.split('').map(function (ch) {
        var map = {
          'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ё': 'e', 'ж': 'zh', 'з': 'z', 'и': 'i', 'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n', 'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'ts', 'ч': 'ch', 'ш': 'sh', 'щ': 'sch', 'ъ': '', 'ы': 'y', 'ь': '', 'э': 'e', 'ю': 'yu', 'я': 'ya',
          'α': 'a', 'β': 'b', 'γ': 'g', 'δ': 'd', 'ε': 'e', 'ζ': 'z', 'η': 'h', 'θ': 'th', 'ι': 'i', 'κ': 'k', 'λ': 'l', 'μ': 'm', 'ν': 'n', 'ξ': 'x', 'ο': 'o', 'π': 'p', 'ρ': 'r', 'σ': 's', 'τ': 't', 'υ': 'y', 'φ': 'f', 'χ': 'x', 'ψ': 'ps', 'ω': 'o',
          '4': 'a', '@': 'a', '8': 'b', '3': 'e', '€': 'e', '9': 'g', '1': 'i', '!': 'i', '|': 'i', '0': 'o', '5': 's', '$': 's', '7': 't', '+': 't', '2': 'z'
        };
        return map[ch] || ch;
      }).join('');
      s = s.replace(/[^a-z0-9]/g, '');
      s = s.replace(/(.)\1{2,}/g, '$1');
      return s;
    }

    function updateHeader() {
      var authDiv = document.getElementById('authButtons');
      var loggedInUser = localStorage.getItem('loggedInUser');
      authDiv.textContent = '';
      if (loggedInUser) {
        var span = document.createElement('span');
        span.style.cssText = 'color:white;font-weight:bold;';
        span.textContent = 'Welcome, ' + loggedInUser + '!';
        var setA = document.createElement('a'); setA.href = 'settings.html';
        var setB = document.createElement('button'); setB.className = 'header-btn'; setB.textContent = 'Settings';
        setA.appendChild(setB);
        var out = document.createElement('button'); out.className = 'header-btn'; out.textContent = 'Logout';
        out.onclick = function () {
          try { if (window.logoutCurrentUser) { logoutCurrentUser().then(function(){location.reload();}); return; } } catch (e) {}
          try { localStorage.removeItem('loggedInUser'); } catch (e2) {}
          location.reload();
        };
        authDiv.appendChild(span); authDiv.appendChild(setA); authDiv.appendChild(out);
      } else {
        var sA = document.createElement('a'); sA.href = 'signup.html';
        var sB = document.createElement('button'); sB.className = 'header-btn'; sB.textContent = 'Sign Up';
        sA.appendChild(sB);
        var lA = document.createElement('a'); lA.href = 'login.html';
        var lB = document.createElement('button'); lB.className = 'header-btn'; lB.textContent = 'Log In';
        lA.appendChild(lB);
        authDiv.appendChild(sA); authDiv.appendChild(lA);
      }
    }

    document.addEventListener('DOMContentLoaded', updateHeader);

    document.getElementById('signupForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      var username = document.getElementById('username').value.trim();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;

      var usernameRegex = /^[A-Za-z0-9_]+$/;
      var normalized = normalizeForModeration(username);
      var bannedWords = ['gay','lesbian','bi','bisexual','nigga','nigger','fag','faggot','retard','fuck','shit','bitch','asshole','dick','pussy','cunt','idiot','trash','discord','youtube','tiktok','instagram','twitter','x.com','nazi','hitler'];

      if (!username || username.length < 3 || username.length > 15) {
        alert('Username must be 3 to 15 characters long.');
        return;
      }

      if (!usernameRegex.test(username)) {
        alert('Usernames can only contain letters, numbers, and underscores.');
        return;
      }

      // Reserved names removed per owner request so deleted accounts like
      // "Admin" / "DynaDuck" can be remade. First-come first-served via usernames/.

      for (var i = 0; i < bannedWords.length; i++) {
        if (normalized.indexOf(bannedWords[i]) !== -1) {
          alert('Username contains restricted text.');
          return;
        }
      }

      try {
        var db = getDb();
        var auth = getAuth();
        if (/[.#$[\]]/.test(username)) { alert('Username contains invalid characters.'); return; }
        if (password.length < 6) { alert('Password must be at least 6 characters.'); return; }
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { alert('Enter a valid email.'); return; }
        var usernameTaken = await db.ref('usernames/' + username).once('value');
        if (usernameTaken.exists()) {
          alert('This username is already taken.');
          return;
        }

        var cred = await auth.createUserWithEmailAndPassword(email, password);
        var uid = cred.user.uid;
        var ekey = email.replace(/\./g, ',').slice(0, 120);

        try {
          await db.ref('usernames/' + username).set(uid);
          await db.ref('emails/' + ekey + '/' + username).set(uid);
        } catch (e) {
          // Roll back auth user if reservation fails (name race).
          try { await cred.user.delete(); } catch (delErr) {}
          throw e;
        }
        try {
          await db.ref('users/' + uid).set({
            username: username,
            email: email,
            joinedDate: Date.now(),
            Dynamites: 1000,
            inventory: { 'Starter Pack': true },
            colors: { head: '#ffcd3a', torso: '#e3242b', 'l-arm': '#ffcd3a', 'r-arm': '#ffcd3a', 'l-leg': '#ffcd3a', 'r-leg': '#ffcd3a' },
            equipped: {}
          });
          // Legacy convert: if old username-keyed data exists (users/Admin), carry over
          // the public displayName only. Never copy password / Dynamites (old values fail validation).
          try {
            var legacySnap = await db.ref('users/' + username + '/displayName').once('value');
            var legacyName = legacySnap.val();
            if (typeof legacyName === 'string' && legacyName.length && legacyName.length <= 40) {
              await db.ref('users/' + uid + '/displayName').set(legacyName.slice(0, 40));
            }
          } catch (legacyErr) {}
        } catch (e) {
          try { await db.ref('usernames/' + username).remove(); } catch (cleanupErr) {}
          try { var _ek = email.replace(/\./g, ',').slice(0, 120); await db.ref('emails/' + _ek + '/' + username).remove(); } catch (cleanupErr2) {}
          try { await cred.user.delete(); } catch (delErr) {}
          throw e;
        }

        // Minimal session: username for display, uid for DB keys.
        // Email is NOT persisted (read from Auth when needed) to avoid PII in clear-text storage.
        localStorage.setItem('loggedInUser', username);
        localStorage.setItem('firebaseUid', uid);
        try { localStorage.removeItem('firebaseEmail'); } catch (e) {}

        try {
          var token = await cred.user.getIdTokenResult(true);
          localStorage.setItem('isAdmin', token.claims && token.claims.admin === true ? 'true' : 'false');
        } catch (tokErr) {
          localStorage.setItem('isAdmin', 'false');
        }

        alert('Account created successfully!');
        window.location.href = 'index.html';
      } catch (error) {
        console.error(error);
        var msg = (error && error.message) || 'Unknown error';
        if (error && error.code === 'auth/email-already-in-use') msg = 'That email is already registered. Try logging in.';
        alert('Sign-up failed: ' + msg);
      }
    });
  </script>

  <script src="search.js"></script>
</body>
</html>
