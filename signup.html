<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Sign Up - DynaDuck</title><link rel="stylesheet" href="style.css"><style>.auth-container{display:flex;justify-content:center;align-items:center;min-height:80vh}.auth-box{background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 20px #0001;width:100%;max-width:400px;text-align:center}.auth-box input{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-bottom:15px;box-sizing:border-box;font-size:1em}.auth-box button{width:100%;padding:12px}.auth-box p{margin-top:20px;color:#666}</style></head>
<body><header><div class="header-left"><a href="index.html"><img src="logo.png" class="logo" alt="DynaDuck"></a><nav><a href="catalog.html">Catalog</a><a href="ideas.html">Ideas</a><a href="create.html">Create</a><a href="dynamites.html">Dynamites</a></nav></div><div class="search-container"><input class="search-bar" type="text" placeholder="Search..."></div><div id="authButtons"></div></header><div class="auth-container"><div class="auth-box"><h1>Create Account</h1><form id="signupForm"><input id="username" placeholder="Username" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="6" placeholder="Password (6+ characters)" required><button class="green-btn" type="submit">Sign Up</button></form><p>Already have an account? <a href="login.html">Log In</a></p></div></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script src="firebase-auth.js"></script><script>
document.getElementById('signupForm').addEventListener('submit',function(e){e.preventDefault();var username=document.getElementById('username').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!/^[A-Za-z0-9_]{3,15}$/.test(username)){alert('Username must be 3–15 letters, numbers, or underscores.');return;}firebaseDb.ref('usernames/'+username).once('value').then(function(s){if(s.exists())throw Error('Username is already taken.');return firebaseAuth.createUserWithEmailAndPassword(email,password);}).then(function(cred){var uid=cred.user.uid;return firebaseDb.ref('usernames/'+username).set(uid).then(function(){return firebaseDb.ref('users/'+uid).set({username:username,email:email,joinedDate:Date.now(),Dynamites:1000,inventory:{'Starter Pack':true},colors:{head:'#ffcd3a',torso:'#e3242b','l-arm':'#ffcd3a','r-arm':'#ffcd3a','l-leg':'#ffcd3a','r-leg':'#ffcd3a'},equipped:{}});});}).then(function(){localStorage.setItem('loggedInUser',username);location.href='index.html';}).catch(function(error){alert('Sign-up failed: '+error.message);});});</script><script src="search.js"></script></body></html>
