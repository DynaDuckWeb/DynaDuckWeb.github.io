<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DynaDuck Sandbox</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    /* Clean, Simple System Font Stack */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    }

    body {
      background-color: #1e1e24;
      color: #e0e0e0;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: #2b2b36;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .brand {
      font-weight: 700;
      font-size: 1.4rem;
      color: #ff6b6b;
      letter-spacing: 0.5px;
    }

    .search-box {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #2b2b36;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #ff6b6b;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      padding: 8px 16px;
      transition: opacity 0.15s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    .green-btn {
      background-color: #2e7d32;
      color: #fff;
    }

    .modern-auth-btn {
      background-color: #ff6b6b;
      color: #fff;
    }

    /* Container & Layout */
    .main-layout {
      display: flex;
      gap: 20px;
    }

    .games-section {
      flex: 3;
    }

    .social-sidebar {
      flex: 1;
      background-color: #2b2b36;
      padding: 15px;
      border-radius: 8px;
      height: fit-content;
    }

    /* Games Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .game-card {
      background-color: #2b2b36;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #383845;
      transition: transform 0.15s ease;
    }

    .game-card:hover {
      transform: translateY(-3px);
    }

    .game-thumb {
      height: 120px;
      background-color: #383845;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .play-overlay {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      text-align: center;
      padding: 4px 0;
      font-size: 0.8rem;
      font-weight: bold;
    }

    /* Modal Panels */
    .panel {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #2b2b36;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #444;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 100;
      max-width: 400px;
      width: 90%;
    }

    .friend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid #383845;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <!-- Header & Navigation -->
  <header>
    <div class="brand">DynaDuck</div>
    <div id="authButtons" style="display: flex; gap: 10px; align-items: center;"></div>
  </header>

  <!-- Search -->
  <div class="search-box">
    <input type="text" id="mainSearchInput" placeholder="Search maps or creators..." onkeyup="filterGamesLocal()" />
  </div>

  <!-- Main Content Layout -->
  <div class="main-layout">
    <div class="games-section">
      <div id="gamesGridContainer" class="grid"></div>
    </div>

    <!-- Social Sidebar -->
    <div class="social-sidebar">
      <div id="userCard" style="display: none; margin-bottom: 15px;">
        <h3>Hello, <span id="displayUsername" style="color: #ff6b6b;"></span></h3>
      </div>

      <div id="pendingSection" style="display: none; margin-bottom: 15px;">
        <h4 style="margin-bottom: 8px;">Requests</h4>
        <div id="requestList"></div>
      </div>

      <h4>Friends</h4>
      <div id="friendInputGroup" style="display: flex; gap: 5px; margin: 10px 0;">
        <input type="text" id="friendInput" placeholder="Username..." />
        <button class="green-btn" onclick="sendRequest()">Add</button>
      </div>
      <div id="friendsList">
        <p id="fallbackFriendsText" style="color: #888; font-size: 0.9rem;">Log in to manage friends.</p>
      </div>
    </div>
  </div>

  <!-- Game Details Modal Panel -->
  <div id="gamePanel" class="panel">
    <h2 id="panelGameTitle" style="margin-bottom: 4px;"></h2>
    <p id="panelGameCreator" style="color: #aaa; font-size: 0.85rem; margin-bottom: 12px;"></p>
    <div id="panelGameShowcase" style="background: #383845; height: 100px; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 12px; border-radius: 4px;"></div>
    <p id="panelGameDesc" style="font-size: 0.9rem; margin-bottom: 15px; color: #ddd;"></p>
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button class="green-btn" id="panelPlayBtn">Play Game</button>
      <button style="background: #555; color: white;" onclick="closeGame()">Close</button>
    </div>
  </div>

  <!-- Rules Modal Panel -->
  <div id="rulesPanel" class="panel">
    <h3>Community Guidelines</h3>
    <p style="font-size: 0.9rem; margin: 10px 0; color: #ccc;">Please follow basic etiquette: no spamming maps, respect other builders, and keep text content appropriate.</p>
    <button class="green-btn" onclick="acceptRules()">I Agree</button>
  </div>

  <!-- Application Logic -->
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ",
      authDomain: "dynaduck-19dbb.firebaseapp.com",
      databaseURL: "https://dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dynaduck-19dbb",
      storageBucket: "dynaduck-19dbb.firebasestorage.app",
      messagingSenderId: "777148453502",
      appId: "1:777148453502:web:2f67ac439ec29dc4fc3e2f"
    };

    try {
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      var db = firebase.database();
    } catch (e) {
      console.error("Firebase initialization failed:", e);
    }

    var currentUser = localStorage.getItem('loggedInUser') || null;
    var rawGamesCache = [];

    function checkRulesCondition() {
      if (!currentUser) {
        var rulesAccepted = sessionStorage.getItem('rulesAccepted');
        if (!rulesAccepted) {
          var panel = document.getElementById('rulesPanel');
          if (panel) panel.style.display = 'block';
        }
      }
    }

    function acceptRules() {
      sessionStorage.setItem('rulesAccepted', 'true');
      var panel = document.getElementById('rulesPanel');
      if (panel) panel.style.display = 'none';
    }

    function listenForGames() {
      var grid = document.getElementById('gamesGridContainer');
      if (!grid || !db) return;
      
      db.ref('games').on('value', function(snapshot) {
        rawGamesCache = [];
        grid.innerHTML = `
          <div class="game-card" onclick="openGame('Baseplate', 'DynaDuck Team', 'A simple sandbox world where you can test builds.', 'baseplate')">
            <div class="game-thumb">
              <span style="color:white; font-weight:bold; font-size:1.1em;">BASEPLATE</span>
              <div class="play-overlay">PLAY BASEPLATE</div>
            </div>
          </div>`;
          
        if (snapshot.exists()) {
          snapshot.forEach(function(childSnapshot) {
            var gameData = childSnapshot.val();
            gameData.key = childSnapshot.key;
            rawGamesCache.push(gameData);

            var title = gameData.title || "Unfinished Map";
            var creator = gameData.creator || "Anonymous";
            var description = gameData.description || "No description provided.";
            var rawDataString = gameData.fileData || "";

            var safeTitle = title.replace(/'/g, "\\'");
            var safeCreator = creator.replace(/'/g, "\\'");
            var safeDesc = description.replace(/'/g, "\\'");
            var safeData = rawDataString.replace(/\\/g, "\\\\").replace(/'/g, "\\'");

            grid.innerHTML += `
              <div class="game-card" onclick="openGame('${safeTitle}', '${safeCreator}', '${safeDesc}', '${safeData}')">
                <div class="game-thumb" style="background-color: #ff6b6b; flex-direction: column;">
                  <span style="color:white; font-weight:bold; font-size:1em; text-align:center; padding:10px;">${title.toUpperCase()}</span>
                  <div class="play-overlay">PLAY NOW</div>
                </div>
              </div>`;
          });
        }
      }, function(error) {
        console.log("Database reading throttled or errored:", error);
      });
    }

    function filterGamesLocal() {
      var q = document.getElementById('mainSearchInput').value.toLowerCase().trim();
      var grid = document.getElementById('gamesGridContainer');
      if (!grid) return;

      grid.innerHTML = `
        <div class="game-card" onclick="openGame('Baseplate', 'DynaDuck Team', 'A simple sandbox world where you can test builds.', 'baseplate')">
          <div class="game-thumb">
            <span style="color:white; font-weight:bold;">BASEPLATE</span>
            <div class="play-overlay">PLAY BASEPLATE</div>
          </div>
        </div>`;

      rawGamesCache.forEach(function(gameData) {
        var title = gameData.title || "";
        var creator = gameData.creator || "";
        if (title.toLowerCase().includes(q) || creator.toLowerCase().includes(q)) {
          var safeTitle = title.replace(/'/g, "\\'");
          var safeCreator = creator.replace(/'/g, "\\'");
          var safeDesc = (gameData.description || "").replace(/'/g, "\\'");
          var safeData = (gameData.fileData || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");

          grid.innerHTML += `
            <div class="game-card" onclick="openGame('${safeTitle}', '${safeCreator}', '${safeDesc}', '${safeData}')">
              <div class="game-thumb" style="background-color: #ff6b6b;">
                <span style="color:white; font-weight:bold;">${title.toUpperCase()}</span>
                <div class="play-overlay">PLAY NOW</div>
              </div>
            </div>`;
        }
      });
    }

    function openGame(title, creator, description, fileData) {
      var tNode = document.getElementById('panelGameTitle');
      var cNode = document.getElementById('panelGameCreator');
      var sNode = document.getElementById('panelGameShowcase');
      var dNode = document.getElementById('panelGameDesc');
      var pBtn = document.getElementById('panelPlayBtn');

      if (tNode) tNode.innerText = title;
      if (cNode) cNode.innerText = "by " + creator;
      if (sNode) sNode.innerText = title.toUpperCase();
      if (dNode) dNode.innerText = description;

      if (pBtn) {
        pBtn.onclick = function() {
          launchGame(fileData);
        };
      }

      var panel = document.getElementById('gamePanel');
      if (panel) panel.style.display = 'block';
    }

    function closeGame() {
      var panel = document.getElementById('gamePanel');
      if (panel) panel.style.display = 'none';
    }

    function launchGame(fileData) {
      var launchUser = currentUser ? currentUser : "GuestPlayer";
      var customProtocolUri = "dynaduck://play?user=" + encodeURIComponent(launchUser) + "&mapData=" + encodeURIComponent(fileData);
      
      console.log("Launching custom scheme:", customProtocolUri);    
      window.location.href = customProtocolUri;
    }

    function initApp() {
      var authDiv = document.getElementById('authButtons');
      checkRulesCondition();
      listenForGames();

      if (currentUser && db) {
        var uCard = document.getElementById('userCard');
        var dUser = document.getElementById('displayUsername');
        var fText = document.getElementById('fallbackFriendsText');

        if (uCard) uCard.style.display = "block"; 
        if (dUser) dUser.innerText = currentUser;
        if (fText) fText.style.display = "none";

        if (authDiv) {
          authDiv.innerHTML = 
            '<span style="color:white; font-weight:bold; margin-right:5px;">' + currentUser + '</span>' +
            '<a href="settings.html"><button class="green-btn">Settings</button></a>' +
            '<button class="green-btn" onclick="logout()">Logout</button>';
        }        

        db.ref('users/' + currentUser + '/presence').set("online");
        db.ref('users/' + currentUser + '/presence').onDisconnect().set("offline");
        loadSocial();
      } else {
        if (authDiv) {
          authDiv.innerHTML = 
            '<a href="login.html"><button class="green-btn">Log In</button></a>' +
            '<a href="signup.html"><button class="green-btn">Sign Up</button></a>';
        }
      }
    }

    function logout() {
      if (currentUser && db) {
        db.ref('users/' + currentUser + '/presence').set("offline").finally(function() {
          localStorage.removeItem('loggedInUser');
          location.reload();
        });
      } else {
        localStorage.removeItem('loggedInUser');
        location.reload();
      }
    }

    function sendRequest() {
      var targetInput = document.getElementById('friendInput');
      if (!targetInput || !db) return;
      var target = targetInput.value.trim();
      if (!currentUser || !target || target === currentUser) return;   

      db.ref('users/' + target).get().then(function(s) {
        if (s.exists()) {
          db.ref('users/' + target + '/requests/' + currentUser).set(true);
          alert("Friend request sent to " + target + "!");
          targetInput.value = "";
        } else { 
          alert("User not found."); 
        }
      });
    }

    function accept(name) {
      if (!currentUser || !db) return;
      var updates = {};
      updates['users/' + currentUser + '/friends/' + name] = true;
      updates['users/' + name + '/friends/' + currentUser] = true;
      updates['users/' + currentUser + '/requests/' + name] = null; 

      db.ref().update(updates, function(err) {
        if (!err) alert("Friend connection synced!");
      });
    }

    function loadSocial() {
      if (!db || !currentUser) return;

      // Requests Listener
      db.ref('users/' + currentUser + '/requests').on('value', function(snap) {
        var list = document.getElementById('requestList');
        var box = document.getElementById('pendingSection');
        if (!list || !box) return;

        if (snap.exists()) {
          box.style.display = "block";
          list.innerHTML = "";
          Object.keys(snap.val()).forEach(function(name) {
            list.innerHTML += 
              '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">' +
                '<span style="font-size:0.9em; font-weight:bold; color:#e0e0e0;">' + name + '</span>' +
                '<button class="modern-auth-btn" style="padding: 3px 8px; font-size:0.8em;" onclick="accept(\'' + name + '\')">Accept</button>' +
              '</div>';
          });
        } else { 
          box.style.display = "none"; 
        }
      });

      // Friends Listener
      db.ref('users/' + currentUser + '/friends').on('value', function(snap) {
        var listDiv = document.getElementById('friendsList');
        if (!listDiv) return;

        if (!snap.exists()) {
          listDiv.innerHTML = "<p style='color:#888; text-align:center; padding:10px 0;'>No friends added yet.</p>";
          return;
        }

        listDiv.innerHTML = "";
        Object.keys(snap.val()).forEach(function(fName) {
          db.ref('users/' + fName + '/presence').on('value', function(sSnap) {
            var status = sSnap.val() || "offline";
            var color = status === "online" ? "#2e7d32" : "#888";
            var el = document.getElementById('f-' + fName);

            if (!el) {
              el = document.createElement('div');
              el.id = 'f-' + fName;
              el.className = 'friend-item';
              listDiv.appendChild(el);
            }

            el.innerHTML = 
              '<div class="status-dot" style="background:' + color + '"></div>' +
              '<strong style="font-size:0.95em; color:#e0e0e0;">' + fName + ' (' + status + ')</strong>';
          });
        });
      });
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
