<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DynaDuck Sandbox</title>
  <link rel="stylesheet" href="style.css" />

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <header>
    <div class="brand">DynaDuck</div>
    <div id="authButtons"></div>
  </header>

  <div class="search-box">
    <input type="text" id="mainSearchInput" placeholder="Search maps or creators..." onkeyup="filterGamesLocal()" />
  </div>

  <div class="main-layout">
    <div class="games-section">
      <div id="gamesGridContainer" class="grid"></div>
    </div>

    <div class="social-sidebar">
      <div id="userCard">
        <h3>Hello, <span id="displayUsername"></span></h3>
      </div>

      <div id="pendingSection">
        <h4>Requests</h4>
        <div id="requestList"></div>
      </div>

      <h4>Friends</h4>
      <div id="friendInputGroup">
        <input type="text" id="friendInput" placeholder="Username..." />
        <button class="green-btn" onclick="sendRequest()">Add</button>
      </div>
      <div id="friendsList">
        <p id="fallbackFriendsText">Log in to manage friends.</p>
      </div>
    </div>
  </div>

  <div id="gamePanel" class="panel">
    <h2 id="panelGameTitle"></h2>
    <p id="panelGameCreator"></p>
    <div id="panelGameShowcase"></div>
    <p id="panelGameDesc"></p>

    <div id="panelActions">
      <button class="green-btn" id="panelPlayBtn">Play Game</button>
      <button class="close-btn" onclick="closeGame()">Close</button>
    </div>
  </div>

  <div id="rulesPanel" class="panel">
    <h3>Community Guidelines</h3>
    <p>Please follow basic etiquette: no spamming maps, respect other builders, and keep text content appropriate.</p>
    <button class="green-btn" onclick="acceptRules()">I Agree</button>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ",
      authDomain: "dynaduck-19dbb.firebaseapp.com",
      databaseURL: "https://dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dynaduck-19dbb",
      storageBucket: "dynaduck-19dbb.firebasestorage.app",
      messagingSenderId: "777148453502",
      appId: "1:777148453502:web:2f67ac439ec29dc4fc3e2f"
    };

    try {
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      var db = firebase.database();
    } catch (e) {
      console.error("Firebase initialization failed:", e);
    }

    var currentUser = localStorage.getItem('loggedInUser') || null;
    var rawGamesCache = [];

    function checkRulesCondition() {
      if (!currentUser) {
        var rulesAccepted = sessionStorage.getItem('rulesAccepted');
        if (!rulesAccepted) {
          var panel = document.getElementById('rulesPanel');
          if (panel) panel.style.display = 'block';
        }
      }
    }

    function acceptRules() {
      sessionStorage.setItem('rulesAccepted', 'true');
      var panel = document.getElementById('rulesPanel');
      if (panel) panel.style.display = 'none';
    }

    function listenForGames() {
      var grid = document.getElementById('gamesGridContainer');
      if (!grid || !db) return;
      
      db.ref('games').on('value', function(snapshot) {
        rawGamesCache = [];
        grid.innerHTML = `
          <div class="game-card" onclick="openGame('Baseplate', 'DynaDuck Team', 'A simple sandbox world where you can test builds.', 'baseplate')">
            <div class="game-thumb">
              <span>BASEPLATE</span>
              <div class="play-overlay">PLAY BASEPLATE</div>
            </div>
          </div>`;
          
        if (snapshot.exists()) {
          snapshot.forEach(function(childSnapshot) {
            var gameData = childSnapshot.val();
            gameData.key = childSnapshot.key;
            rawGamesCache.push(gameData);

            var title = gameData.title || "Unfinished Map";
            var creator = gameData.creator || "Anonymous";
            var description = gameData.description || "No description provided.";
            var rawDataString = gameData.fileData || "";

            var safeTitle = title.replace(/'/g, "\\'");
            var safeCreator = creator.replace(/'/g, "\\'");
            var safeDesc = description.replace(/'/g, "\\'");
            var safeData = rawDataString.replace(/\\/g, "\\\\").replace(/'/g, "\\'");

            grid.innerHTML += `
              <div class="game-card" onclick="openGame('${safeTitle}', '${safeCreator}', '${safeDesc}', '${safeData}')">
                <div class="game-thumb">
                  <span>${title.toUpperCase()}</span>
                  <div class="play-overlay">PLAY NOW</div>
                </div>
              </div>`;
          });
        }
      }, function(error) {
        console.log("Database reading throttled or errored:", error);
      });
    }

    function filterGamesLocal() {
      var q = document.getElementById('mainSearchInput').value.toLowerCase().trim();
      var grid = document.getElementById('gamesGridContainer');
      if (!grid) return;

      grid.innerHTML = `
        <div class="game-card" onclick="openGame('Baseplate', 'DynaDuck Team', 'A simple sandbox world where you can test builds.', 'baseplate')">
          <div class="game-thumb">
            <span>BASEPLATE</span>
            <div class="play-overlay">PLAY BASEPLATE</div>
          </div>
        </div>`;

      rawGamesCache.forEach(function(gameData) {
        var title = gameData.title || "";
        var creator = gameData.creator || "";
        if (title.toLowerCase().includes(q) || creator.toLowerCase().includes(q)) {
          var safeTitle = title.replace(/'/g, "\\'");
          var safeCreator = creator.replace(/'/g, "\\'");
          var safeDesc = (gameData.description || "").replace(/'/g, "\\'");
          var safeData = (gameData.fileData || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");

          grid.innerHTML += `
            <div class="game-card" onclick="openGame('${safeTitle}', '${safeCreator}', '${safeDesc}', '${safeData}')">
              <div class="game-thumb">
                <span>${title.toUpperCase()}</span>
                <div class="play-overlay">PLAY NOW</div>
              </div>
            </div>`;
        }
      });
    }

    function openGame(title, creator, description, fileData) {
      var tNode = document.getElementById('panelGameTitle');
      var cNode = document.getElementById('panelGameCreator');
      var sNode = document.getElementById('panelGameShowcase');
      var dNode = document.getElementById('panelGameDesc');
      var pBtn = document.getElementById('panelPlayBtn');

      if (tNode) tNode.innerText = title;
      if (cNode) cNode.innerText = "by " + creator;
      if (sNode) sNode.innerText = title.toUpperCase();
      if (dNode) dNode.innerText = description;

      if (pBtn) {
        pBtn.onclick = function() {
          launchGame(fileData);
        };
      }

      var panel = document.getElementById('gamePanel');
      if (panel) panel.style.display = 'block';
    }

    function closeGame() {
      var panel = document.getElementById('gamePanel');
      if (panel) panel.style.display = 'none';
    }

    function launchGame(fileData) {
      var launchUser = currentUser ? currentUser : "GuestPlayer";
      var customProtocolUri = "dynaduck://play?user=" + encodeURIComponent(launchUser) + "&mapData=" + encodeURIComponent(fileData);
      
      console.log("Launching custom scheme:", customProtocolUri);    
      window.location.href = customProtocolUri;
    }

    function initApp() {
      var authDiv = document.getElementById('authButtons');
      checkRulesCondition();
      listenForGames();

      if (currentUser && db) {
        var uCard = document.getElementById('userCard');
        var dUser = document.getElementById('displayUsername');
        var fText = document.getElementById('fallbackFriendsText');

        if (uCard) uCard.style.display = "block"; 
        if (dUser) dUser.innerText = currentUser;
        if (fText) fText.style.display = "none";

        if (authDiv) {
          authDiv.innerHTML = 
            '<span class="user-tag">' + currentUser + '</span>' +
            '<a href="settings.html"><button class="green-btn">Settings</button></a>' +
            '<button class="green-btn" onclick="logout()">Logout</button>';
        }        

        db.ref('users/' + currentUser + '/presence').set("online");
        db.ref('users/' + currentUser + '/presence').onDisconnect().set("offline");
        loadSocial();
      } else {
        if (authDiv) {
          authDiv.innerHTML = 
            '<a href="login.html"><button class="green-btn">Log In</button></a>' +
            '<a href="signup.html"><button class="green-btn">Sign Up</button></a>';
        }
      }
    }

    function logout() {
      if (currentUser && db) {
        db.ref('users/' + currentUser + '/presence').set("offline").finally(function() {
          localStorage.removeItem('loggedInUser');
          location.reload();
        });
      } else {
        localStorage.removeItem('loggedInUser');
        location.reload();
      }
    }

    function sendRequest() {
      var targetInput = document.getElementById('friendInput');
      if (!targetInput || !db) return;
      var target = targetInput.value.trim();
      if (!currentUser || !target || target === currentUser) return;   

      db.ref('users/' + target).get().then(function(s) {
        if (s.exists()) {
          db.ref('users/' + target + '/requests/' + currentUser).set(true);
          alert("Friend request sent to " + target + "!");
          targetInput.value = "";
        } else { 
          alert("User not found."); 
        }
      });
    }

    function accept(name) {
      if (!currentUser || !db) return;
      var updates = {};
      updates['users/' + currentUser + '/friends/' + name] = true;
      updates['users/' + name + '/friends/' + currentUser] = true;
      updates['users/' + currentUser + '/requests/' + name] = null; 

      db.ref().update(updates, function(err) {
        if (!err) alert("Friend connection synced!");
      });
    }

    function loadSocial() {
      if (!db || !currentUser) return;

      db.ref('users/' + currentUser + '/requests').on('value', function(snap) {
        var list = document.getElementById('requestList');
        var box = document.getElementById('pendingSection');
        if (!list || !box) return;

        if (snap.exists()) {
          box.style.display = "block";
          list.innerHTML = "";
          Object.keys(snap.val()).forEach(function(name) {
            list.innerHTML += 
              '<div class="request-item">' +
                '<span>' + name + '</span>' +
                '<button class="modern-auth-btn" onclick="accept(\'' + name + '\')">Accept</button>' +
              '</div>';
          });
        } else { 
          box.style.display = "none"; 
        }
      });

      db.ref('users/' + currentUser + '/friends').on('value', function(snap) {
        var listDiv = document.getElementById('friendsList');
        if (!listDiv) return;

        if (!snap.exists()) {
          listDiv.innerHTML = "<p class='no-friends'>No friends added yet.</p>";
          return;
        }

        listDiv.innerHTML = "";
        Object.keys(snap.val()).forEach(function(fName) {
          db.ref('users/' + fName + '/presence').on('value', function(sSnap) {
            var status = sSnap.val() || "offline";
            var el = document.getElementById('f-' + fName);

            if (!el) {
              el = document.createElement('div');
              el.id = 'f-' + fName;
              el.className = 'friend-item';
              listDiv.appendChild(el);
            }

            el.innerHTML = 
              '<div class="status-dot ' + status + '"></div>' +
              '<strong>' + fName + ' (' + status + ')</strong>';
          });
        });
      });
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
