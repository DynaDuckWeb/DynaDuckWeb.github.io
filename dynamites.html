<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamites - DynaDuck</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body {
  margin:0;
  font-family:'Poppins', sans-serif;
  background:#f2f2f2;
  color:#222;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#333;
  padding:15px 40px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  height:70px;
  cursor:pointer;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  text-decoration:none;
  color:white;
  font-weight:600;
  transition:0.2s;
}

nav a:hover{
  color:#11AD36;
}

.search-container{
  flex:1;
  display:flex;
  justify-content:center;
}

.search-bar{
  width:320px;
  padding:10px 12px;
  border-radius:8px;
  border:none;
  outline:none;
  font-size:1em;
}

.green-btn{
  background:#11AD36;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

.green-btn:hover{
  background:#0d8d2b;
}

#authButtons{
  display:flex;
  gap:12px;
  align-items:center;
}

.dynamites-page { 
  max-width:1200px;
  margin:40px auto;
  padding:0 20px;
}

.dynamites-top{
  margin-bottom:35px;
}

.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
  padding: 20px 25px;
  border-radius: 16px;
  border: 1px solid #ddd;
  box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.dynamites-top h1{
  margin:0;
  font-size:2.5em;
}

.dynamites-top p{
  color:#666;
  margin-top:8px;
  margin-bottom:0;
}

.balance-box {
  display: flex;
  align-items: center;
  gap: 20px;
  text-align: right;
}

.balance-box span {
  font-size: 0.85em;
  color: #888;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.balance-box h2 {
  margin: 2px 0 0 0;
  color: #11AD36;
  font-size: 2.2em;
  font-weight: 700;
}

.dynamites-grid{
  display:flex;
  gap:25px;
  flex-wrap:wrap;
}

.dynamite-card{
  width:320px;
  background:white;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #ddd;
  box-shadow:0 3px 12px rgba(0,0,0,0.08);
  transition:0.2s;
}

.dynamite-card:hover{
  transform:translateY(-5px);
  box-shadow:0 6px 18px rgba(0,0,0,0.12);
}

.dynamite-image{
  height:240px;
  background:#f7f7f7;
  display:flex;
  align-items:center;
  justify-content:center;
}

.dynamite-image img{
  width:450px;
  height:450px;
  object-fit:contain;
  position:relative;
  top:25px;
}

.dynamite-content{
  padding:20px;
}

.dynamite-content h2{
  margin:0;
  font-size:1.5em;
}

.dynamite-price{
  color:#11AD36;
  font-weight:bold;
  font-size:1.3em;
  margin-top:10px;
  margin-bottom:20px;
}

.buy-btn{
  width:100%;
  border:none;
  background:#11AD36;
  color:white;
  padding:14px;
  border-radius:10px;
  font-size:1em;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

.buy-btn:hover{
  background:#0d8d2b;
}

/* Modal Styles */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.modal-card {
  background: white;
  padding: 30px;
  border-radius: 16px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  text-align: center;
}

.modal-card h2 {
  margin-top: 0;
  font-size: 1.8em;
}

.modal-input {
  width: 100%;
  padding: 12px;
  margin: 18px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 1em;
  box-sizing: border-box;
  text-align: center;
  text-transform: uppercase;
  font-weight: bold;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <a href="index.html">
      <img src="logo.png" class="logo" alt="Logo">
    </a>
    <nav>
      <a href="catalog.html">Catalog</a>
      <a href="ideas.html">Ideas</a>
      <a href="create.html">Create</a>
      <a href="dynamites.html">Dynamites</a>
    </nav>
  </div>
  <div class="search-container">
    <input type="text" class="search-bar" placeholder="Search...">
  </div>
  <div id="authButtons"></div>
</header>
<main class="dynamites-page">
<div class="dynamites-top">
  <div class="top-row">
    <div>
      <h1>Dynamites</h1>
      <p>Buy those stuff so you can look goodie 💥</p>
    </div>
    <div class="balance-box">
      <button class="green-btn" onclick="openRedeemModal()">Redeem Code</button>
      <div>
        <span>Your Balance</span>
        <h2 id="dynamiteBalance">0</h2>
      </div>
    </div>
  </div>
</div>
  <div class="dynamites-grid">
    <div class="dynamite-card">
      <div class="dynamite-image">
        <img src="dynamites_new_explosion.png" alt="200 Dynamites">
      </div>
      <div class="dynamite-content">
        <h2>200 Dynamites</h2>
        <div class="dynamite-price">
          $1.00
        </div>
        <button class="buy-btn" onclick="buyDynamites(200)">
          Buy
        </button>
      </div>
    </div>
    <div class="dynamite-card">
      <div class="dynamite-image">
        <img src="dynamites_new_explosion.png" alt="800 Dynamites">
      </div>
      <div class="dynamite-content">
        <h2>800 Dynamites</h2>
        <div class="dynamite-price">
          $2.00
        </div>
        <button class="buy-btn" onclick="buyDynamites(800)">
          Buy
        </button>
      </div>
    </div>
    <div class="dynamite-card">
      <div class="dynamite-image">
        <img src="dynamites_new_explosion.png" alt="2000 Dynamites">
      </div>
      <div class="dynamite-content">
        <h2>2000 Dynamites</h2>
        <div class="dynamite-price">
          $3.00
        </div>
        <button class="buy-btn" onclick="buyDynamites(2000)">
          Buy
        </button>
      </div>
    </div>
  </div>
</main>

<div class="modal-overlay" id="redeemModal">
  <div class="modal-card">
    <h2>Redeem Key</h2>
    <p style="color:#666; font-size:0.9em;">Enter the code you received on Gumroad to claim your Dynamites.</p>
    <input type="text" id="codeKeyInput" class="modal-input" placeholder="DYNA-XXXX-XXXX-XXXX">
    <button class="green-btn" style="width:100%; padding:12px;" onclick="claimKey()">Claim Dynamites</button>
    <button class="green-btn" style="width:100%; padding:10px; margin-top:8px; background:#ccc; color:#333;" onclick="closeRedeemModal()">Cancel</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDtxYw55qR1wO3fw3EBivVhz4XI_H7GzvQ",
  authDomain: "dynaduck-19dbb.firebaseapp.com",
  databaseURL: "https://dynaduck-19dbb-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dynaduck-19dbb",
  storageBucket: "dynaduck-19dbb.firebasestorage.app",
  messagingSenderId: "777148453502",
  appId: "1:777148453502:web:2f67ac439ec29dc4fc3e2f"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();
const currentUser = localStorage.getItem("loggedInUser");

const permalinkAmounts = {
  "coczb": 200,
  "mhhui": 800,
  "ympqmm": 2000
};

function loadBalance(){
  if(!currentUser){
    document.getElementById("dynamiteBalance").innerText = "0";
    return;
  }
  const balanceRef = db.ref("users/" + currentUser + "/dynamites");
  balanceRef.on("value", snapshot => {
    let balance = snapshot.val();
    if(balance == null){
      balance = 0;
      balanceRef.set(0);
    }
    document.getElementById("dynamiteBalance").innerText = balance;
  });
}

function openRedeemModal() {
  if (!currentUser) {
    alert("Please log in first.");
    return;
  }
  document.getElementById("redeemModal").style.display = "flex";
}

function closeRedeemModal() {
  document.getElementById("redeemModal").style.display = "none";
}

async function claimKey() {
  const codeInput = document.getElementById("codeKeyInput").value.trim().toUpperCase();
  if (!codeInput) {
    alert("Please enter a code.");
    return;
  }

  if (!currentUser) {
    alert("Please log in first.");
    return;
  }

  const sanitizedKey = codeInput.replace(/[.#$\[\]]/g, "_");
  const usedKeyRef = db.ref("used_gumroad_keys/" + sanitizedKey);

  try {
    const keySnap = await usedKeyRef.once("value");
    if (keySnap.exists()) {
      alert("This code has already been claimed!");
      return;
    }
    const response = await fetch("https://gumroad-verify.ericmiro68.workers.dev/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        product_permalink: "coczb", 
        license_key: codeInput
      })
    });

    const data = await response.json();

    if (data.valid) {
      const productPermalink = data.raw.purchase.product_permalink || "coczb";
      const amountToAdd = permalinkAmounts[productPermalink] || 200;

      await usedKeyRef.set({
        claimed_by: currentUser,
        claimed_at: Date.now(),
        email: data.raw.purchase.email || "unknown",
        amount: amountToAdd
      });

      const userBalanceRef = db.ref("users/" + currentUser + "/dynamites");
      userBalanceRef.transaction((currentBal) => {
        return (currentBal || 0) + amountToAdd;
      }, (balErr, balCommitted) => {
        if (balCommitted) {
          alert(`Success! Credited ${amountToAdd} Dynamites to ${currentUser}.`);
          closeRedeemModal();
          document.getElementById("codeKeyInput").value = "";
        } else {
          alert("Error updating your balance. Please contact support.");
        }
      }); // the amount of times i edited this part is just crazy

    } else {
      alert("Redemption Failed: " + (data.reason || "Invalid code."));
    }

  } catch (err) {
    console.error("Verification error:", err);
    alert("Failed to verify key. Please try again.");
  }
}

function buyDynamites(amount){
  if(!currentUser){
    alert("Please log in first.");
    return;
  }

  let gumroadUrl = "";
  
  if (amount === 200) {
    gumroadUrl = "https://miroverse77.gumroad.com/l/coczb";
  } else if (amount === 800) {
    gumroadUrl = "https://miroverse77.gumroad.com/l/mhhui";
  } else if (amount === 2000) {
    gumroadUrl = "https://miroverse77.gumroad.com/l/ympqmm";
  }

  if (gumroadUrl !== "") {
    window.open(gumroadUrl, '_blank');
  }
}

function updateHeader(){
  const authDiv = document.getElementById("authButtons");
  if(currentUser){
    authDiv.innerHTML = `
      <span style="color:white; font-weight:bold; margin-right:10px;">
        Welcome, ${currentUser}!
      </span>
      <a href="settings.html">
        <button class="green-btn" style="margin-right:10px;">
          Settings
        </button>
      </a>
      <button class="green-btn" onclick="logout()">
        Logout
      </button>
    `;
  } else {
    authDiv.innerHTML = `
      <a href="signup.html" style="margin-right:10px;">
        <button class="green-btn">
          Sign Up
        </button>
      </a>
      <a href="login.html">
        <button class="green-btn">
          Log In
        </button>
      </a>
    `;
  }
}

function logout(){
  localStorage.removeItem("loggedInUser");
  location.reload();
}

window.addEventListener("DOMContentLoaded", () => {
    updateHeader();
    loadBalance();
  }
);
</script>
</body>
</html>
