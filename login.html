<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In - DynaDuck</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container { display:flex; justify-content:center; align-items:center; min-height:80vh; }
    .auth-box { background:white; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); width:100%; max-width:400px; text-align:center; }
    .auth-box h1 { margin-top:0; margin-bottom:20px; font-size:2em; color:#333; }
    .auth-box input { width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; margin-bottom:15px; box-sizing:border-box; font-size:1em; outline:none; }
    .auth-box input:focus { border-color:#11AD36; }
    .auth-box button { width:100%; padding:12px; font-size:1.05em; }
    .auth-box p { margin-top:20px; font-size:0.9em; color:#666; }
    .auth-box p a { color:#11AD36; text-decoration:none; font-weight:600; }
    .auth-box p a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="logo.png" class="logo" alt="DynaDuck" onclick="window.location.href='index.html'">
      <nav>
        <a href="catalog.html">Catalog</a>
        <a href="ideas.html">Ideas</a>
        <a href="create.html">Create</a>
        <a href="dynamites.html">Dynamites</a>
      </nav>
    </div>
    <div class="search-container"><input type="text" class="search-bar" placeholder="Search..."></div>
    <div id="authButtons"></div>
  </header>

  <div class="auth-container">
    <div class="auth-box">
      <h1>Log In</h1>
      <form id="loginForm">
        <input type="text" id="loginEmail" placeholder="Username or Email" required autocomplete="username">
        <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
        <button type="submit" class="green-btn">Log In</button>
      </form>
      <p>Don’t have an account? <a href="signup.html">Sign Up</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="firebase-auth.js"></script>

  <script>
    function getAuth() { return window.firebaseAuth || firebase.auth(); }
    function getDb() { return window.firebaseDb || firebase.database(); }
    function escHtml(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

    function updateHeader() {
      var authDiv = document.getElementById('authButtons');
      var loggedInUser = localStorage.getItem('loggedInUser');

      if (loggedInUser) {
        authDiv.textContent = '';
        var span = document.createElement('span');
        span.style.cssText = 'color:white;font-weight:bold;';
        span.textContent = 'Welcome, ' + loggedInUser + '!';
        var a = document.createElement('a'); a.href = 'settings.html';
        var sb = document.createElement('button'); sb.className = 'header-btn'; sb.textContent = 'Settings';
        a.appendChild(sb);
        var lo = document.createElement('button'); lo.className = 'header-btn'; lo.textContent = 'Logout';
        lo.onclick = function () { getAuth().signOut().then(function () {
          try { localStorage.removeItem('loggedInUser'); localStorage.removeItem('firebaseUid'); localStorage.removeItem('firebaseEmail'); localStorage.removeItem('isAdmin'); } catch (e) {}
          location.reload();
        }); };
        authDiv.appendChild(span); authDiv.appendChild(a); authDiv.appendChild(lo);
      } else {
        authDiv.innerHTML = '<a href="signup.html"><button class="header-btn">Sign Up</button></a>' +
          '<a href="login.html"><button class="header-btn">Log In</button></a>';
      }
    }

    document.addEventListener('DOMContentLoaded', updateHeader);

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      var loginInput = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;

      if (!loginInput || !password) {
        alert('Please enter your username/email and password.');
        return;
      }

      try {
        var auth = getAuth();
        var db = getDb();
        var email = loginInput;
        var typedUsername = null;
        // Username login: resolve username -> uid -> email via public mappings.
        // Usernames are case-sensitive in DB; also try exact match first (fixes "Admin" not found when typed "admin").
        if (loginInput.indexOf('@') === -1) {
          typedUsername = loginInput;
          if (/[.#$[\]/]/.test(typedUsername)) { alert('Invalid username.'); return; }
          var nameSnap = await db.ref('usernames/' + typedUsername).once('value');
          if (!nameSnap.exists()) {
            alert('Username "' + typedUsername + '" not found. If this is the legacy "Admin" account, log in with its email once — I will repair the username mapping automatically.');
            return;
          }
          var uid = nameSnap.val();
          var userSnap = await db.ref('users/' + uid + '/email').once('value');
          email = userSnap.val() || typedUsername;
          if (email === typedUsername && email.indexOf('@') === -1) {
            alert('Could not resolve email for that username. Try logging in with email.');
            return;
          }
        }
        var cred = await auth.signInWithEmailAndPassword(email, password);
        var profileSnap = await db.ref('users/' + cred.user.uid).once('value');
        var profile = profileSnap.val() || {};
        var username = profile.username || typedUsername || (cred.user.email || email).split('@')[0];

        // Self-repair legacy accounts (e.g. old "Admin" under users/Admin with no usernames/ entry).
        try {
          var mapRef = db.ref('usernames/' + username);
          var mapSnap = await mapRef.once('value');
          if (!mapSnap.exists()) { await mapRef.set(cred.user.uid); }
        } catch (repairErr) { /* rules may deny — non-fatal */ }

        // Minimal session: username for display, uid for DB keys.
        // Email is NOT persisted (read from Auth when needed) to avoid PII in clear-text storage.
        localStorage.setItem('loggedInUser', username);
        localStorage.setItem('firebaseUid', cred.user.uid);
        try { localStorage.removeItem('firebaseEmail'); } catch (e) {}

        try {
          var token = await cred.user.getIdTokenResult(true);
          localStorage.setItem('isAdmin', token.claims && token.claims.admin === true ? 'true' : 'false');
        } catch (tokErr) {
          localStorage.setItem('isAdmin', 'false');
        }

        window.location.href = 'index.html';
      } catch (error) {
        console.error(error);
        alert('Login failed: ' + (error.message || 'Unknown error'));
      }
    });
  </script>

  <script src="search.js"></script>
</body>
</html>
