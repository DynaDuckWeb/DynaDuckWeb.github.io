<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In - DynaDuck</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container { display:flex; justify-content:center; align-items:center; min-height:80vh; }
    .auth-box { background:white; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); width:100%; max-width:400px; text-align:center; }
    .auth-box h1 { margin-top:0; margin-bottom:20px; font-size:2em; color:#333; }
    .auth-box input { width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; margin-bottom:15px; box-sizing:border-box; font-size:1em; outline:none; }
    .auth-box input:focus { border-color:#11AD36; }
    .auth-box button { width:100%; padding:12px; font-size:1.05em; }
    .auth-box p { margin-top:20px; font-size:0.9em; color:#666; }
    .auth-box p a { color:#11AD36; text-decoration:none; font-weight:600; }
    .auth-box p a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="logo.png" class="logo" alt="DynaDuck" onclick="window.location.href='index.html'">
      <nav>
        <a href="catalog.html">Catalog</a>
        <a href="ideas.html">Ideas</a>
        <a href="create.html">Create</a>
        <a href="dynamites.html">Dynamites</a>
      </nav>
    </div>
    <div class="search-container"><input type="text" class="search-bar" placeholder="Search..."></div>
    <div id="authButtons"></div>
  </header>

  <div class="auth-container">
    <div class="auth-box">
      <h1>Log In</h1>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit" class="green-btn">Log In</button>
      </form>
      <p>Don’t have an account? <a href="signup.html">Sign Up</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="firebase-auth.js"></script>

  <script>
    var auth = firebaseAuth;
    var db = firebaseDb;

    function updateHeader() {
      var authDiv = document.getElementById('authButtons');
      var loggedInUser = localStorage.getItem('loggedInUser');

      if (loggedInUser) {
        authDiv.innerHTML = '<span style="color:white;font-weight:bold;">Welcome, ' + loggedInUser + '!</span>' +
          '<a href="settings.html"><button class="header-btn">Settings</button></a>' +
          '<button class="header-btn" onclick="logoutCurrentUser().then(function(){location.reload();})">Logout</button>';
      } else {
        authDiv.innerHTML = '<a href="signup.html"><button class="header-btn">Sign Up</button></a>' +
          '<a href="login.html"><button class="header-btn">Log In</button></a>';
      }
    }

    document.addEventListener('DOMContentLoaded', updateHeader);

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        alert('Please enter both email and password.');
        return;
      }

      try {
        var cred = await auth.signInWithEmailAndPassword(email, password);
        var profileSnap = await db.ref('users/' + cred.user.uid).once('value');
        var profile = profileSnap.val() || {};
        var username = profile.username || email.split('@')[0];

        localStorage.setItem('loggedInUser', username);
        localStorage.setItem('firebaseUid', cred.user.uid);
        localStorage.setItem('firebaseEmail', cred.user.email || '');

        var token = await cred.user.getIdTokenResult(true);
        localStorage.setItem('isAdmin', token.claims && token.claims.admin === true ? 'true' : 'false');

        window.location.href = 'index.html';
      } catch (error) {
        console.error(error);
        alert('Login failed: ' + (error.message || 'Unknown error'));
      }
    });
  </script>

  <script src="search.js"></script>
</body>
</html>
