<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In - DynaDuck</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container { display:flex; justify-content:center; align-items:center; min-height:80vh; }
    .auth-box { background:white; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); width:100%; max-width:400px; text-align:center; }
    .auth-box h1 { margin-top:0; margin-bottom:20px; font-size:2em; color:#333; }
    .auth-box input { width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; margin-bottom:15px; box-sizing:border-box; font-size:1em; outline:none; }
    .auth-box input:focus { border-color:#11AD36; }
    .auth-box button { width:100%; padding:12px; font-size:1.05em; }
    .auth-box p { margin-top:20px; font-size:0.9em; color:#666; }
    .auth-box p a { color:#11AD36; text-decoration:none; font-weight:600; }
    .auth-box p a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="logo.png" class="logo" alt="DynaDuck" onclick="window.location.href='index.html'">
      <nav>
        <a href="catalog.html">Catalog</a>
        <a href="ideas.html">Ideas</a>
        <a href="create.html">Create</a>
        <a href="dynamites.html">Dynamites</a>
      </nav>
    </div>
    <div class="search-container"><input type="text" class="search-bar" placeholder="Search..."></div>
    <div id="authButtons"></div>
  </header>

  <div class="auth-container">
    <div class="auth-box">
      <h1>Log In</h1>
      <form id="loginForm">
        <input type="text" id="loginEmail" placeholder="Username or Email" required autocomplete="username">
        <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
        <button type="submit" class="green-btn">Log In</button>
      </form>
      <div id="accountChooser" style="display:none;margin-top:15px;">
        <p style="font-size:.9em;color:#666;margin:0 0 8px;">That email owns several accounts — choose one:</p>
        <div id="accountBtns" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
      <p>Don’t have an account? <a href="signup.html">Sign Up</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="firebase-auth.js"></script>

  <script>
    function getAuth() { return window.firebaseAuth || firebase.auth(); }
    function getDb() { return window.firebaseDb || firebase.database(); }
    function escHtml(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

    function updateHeader() {
      var authDiv = document.getElementById('authButtons');
      var loggedInUser = localStorage.getItem('loggedInUser');

      if (loggedInUser) {
        authDiv.textContent = '';
        var span = document.createElement('span');
        span.style.cssText = 'color:white;font-weight:bold;';
        span.textContent = 'Welcome, ' + loggedInUser + '!';
        var a = document.createElement('a'); a.href = 'settings.html';
        var sb = document.createElement('button'); sb.className = 'header-btn'; sb.textContent = 'Settings';
        a.appendChild(sb);
        var lo = document.createElement('button'); lo.className = 'header-btn'; lo.textContent = 'Logout';
        lo.onclick = function () { getAuth().signOut().then(function () {
          try { localStorage.removeItem('loggedInUser'); localStorage.removeItem('firebaseUid'); localStorage.removeItem('firebaseEmail'); localStorage.removeItem('isAdmin'); } catch (e) {}
          location.reload();
        }); };
        authDiv.appendChild(span); authDiv.appendChild(a); authDiv.appendChild(lo);
      } else {
        authDiv.innerHTML = '<a href="signup.html"><button class="header-btn">Sign Up</button></a>' +
          '<a href="login.html"><button class="header-btn">Log In</button></a>';
      }
    }

    document.addEventListener('DOMContentLoaded', updateHeader);

    async function maybeChooseAccount(db, emailInput) {
      var ekey = emailInput.replace(/\./g, ',').slice(0, 120);
      var snap;
      try { snap = await db.ref('emails/' + ekey).once('value'); }
      catch (e) { return emailInput; }
      var val = snap.val() || {};
      var names = Object.keys(val).filter(function (n) { return /^[A-Za-z0-9_]{3,15}$/.test(n); });
      if (names.length <= 1) return emailInput;
      var box = document.getElementById('accountChooser');
      var btns = document.getElementById('accountBtns');
      btns.textContent = '';
      box.style.display = 'block';
      names.sort().forEach(function (n) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'green-btn'; b.textContent = n;
        b.onclick = function () {
          document.getElementById('loginEmail').value = n;
          box.style.display = 'none';
          if (typeof document.getElementById('loginForm').requestSubmit === 'function') {
            document.getElementById('loginForm').requestSubmit();
          } else {
            document.getElementById('loginForm').dispatchEvent(new Event('submit', { cancelable: true }));
          }
        };
        btns.appendChild(b);
      });
      return null;
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  document.getElementById('accountChooser').style.display = 'none';
  document.getElementById('accountBtns').textContent = '';

  var loginInput = document.getElementById('loginEmail').value.trim();
  var password = document.getElementById('loginPassword').value;

  if (!loginInput || !password) {
    alert('Please enter your username/email and password.');
    return;
  }

  try {
    var auth = getAuth();
    var db = getDb();

    if (loginInput.indexOf('@') !== -1) {
      var picked = await maybeChooseAccount(db, loginInput);
      if (picked === null) return;
      if (picked) loginInput = picked;
    }

    var email = loginInput;
    var typedUsername = null;
    var assumedUid = null;

    if (loginInput.indexOf('@') === -1) {
      typedUsername = loginInput;
      if (/[.#$[\]/]/.test(typedUsername)) { alert('Invalid username characters.'); return; }
      
      var nameSnap = await db.ref('usernames/' + typedUsername).once('value');
      if (!nameSnap.exists()) {
        alert('Username "' + loginInput + '" does not exist.');
        return;
      }

      var uid = nameSnap.val();
      assumedUid = uid;
      var userSnap = await db.ref('users/' + uid + '/email').once('value');
      email = userSnap.val();

      if (!email || email.indexOf('@') === -1) {
        alert('Could not resolve a valid email address for that username.');
        return;
      }
    } else {
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        alert('Please enter a valid email address.');
        return;
      }
    }

    var cred = await auth.signInWithEmailAndPassword(email, password);
    
    if (assumedUid && cred.user.uid !== assumedUid) {
      var actualSnap = await db.ref('users/' + cred.user.uid).once('value');
      var actualName = (actualSnap.val() || {}).username || cred.user.email;
      alert('That password belongs to "' + actualName + '", not "' + typedUsername + '".');
    }

    var profileSnap = await db.ref('users/' + cred.user.uid).once('value');
    var profile = profileSnap.val() || {};
    var username = profile.username || typedUsername || cred.user.email.split('@')[0];

    localStorage.setItem('loggedInUser', username);
    localStorage.setItem('firebaseUid', cred.user.uid);
    try { localStorage.removeItem('firebaseEmail'); } catch (e) {}

    window.location.href = 'index.html';
  } catch (error) {
    console.error(error);
    alert('Login failed: ' + (error.message || 'Unknown error'));
  }
});
  </script>

  <script src="search.js"></script>
</body>
</html>
